            <div style={{fontSize:32,animation:"spin 1.5s linear infinite"}}>⚙️</div>
            <style>{`@keyframes spin{from{transform:rotate(0deg)}to{transform:rotate(360deg)}}`}</style>
            <div style={{fontSize:12,color:C.accent,fontFamily:T.mono,fontWeight:600}}>Jahresrechnung wird analysiert…</div>
            <div style={{fontSize:10,color:C.dim,fontFamily:T.mono,textAlign:"center",lineHeight:1.8}}>
              Die AI liest Bilanz und Erfolgsrechnung aus.<br/>Dies dauert 10–20 Sekunden.
            </div>
          </div>
        )}

        {/* Interview Phase */}
        {(phase==="interview"||phase==="done")&&(
          <>
            {extracted&&(
              <div style={{padding:"0.75rem 1.2rem",background:C.bg,borderBottom:`1px solid ${C.border}`,display:"flex",gap:"1.5rem",flexWrap:"wrap"}}>
                {extracted.jahre?.slice(0,3).map((j,i)=>(
                  <div key={i} style={{fontSize:11,fontFamily:T.mono}}>
                    <span style={{color:C.dim}}>{j.jahr}: </span>
                    <span style={{color:C.accent,fontWeight:600}}>CHF {(j.jahresgewinn||0).toLocaleString("de-CH")}</span>
                  </div>
                ))}
                {extracted.rechtsform&&<div style={{fontSize:11,fontFamily:T.mono,color:C.dim}}>{extracted.rechtsform} · {extracted.kanton}</div>}
              </div>
            )}
            <div ref={chatRef} style={{flex:1,overflowY:"auto",padding:"1.2rem",display:"flex",flexDirection:"column",gap:"0.8rem",minHeight:220,maxHeight:340}}>
              {chatHistory.map((m,i)=>(
                <div key={i} style={{display:"flex",justifyContent:m.role==="user"?"flex-end":"flex-start"}}>
                  <div style={{maxWidth:"80%",padding:"0.65rem 0.9rem",borderRadius:8,background:m.role==="user"?C.green:C.bg,border:`1px solid ${m.role==="user"?C.greenb:C.border}`,fontSize:11,color:m.role==="user"?C.accent:C.text,fontFamily:T.mono,lineHeight:1.7}}>
                    {m.content}
                  </div>
                </div>
              ))}
              {chatLoading&&(
                <div style={{display:"flex",justifyContent:"flex-start"}}>
                  <div style={{padding:"0.65rem 0.9rem",borderRadius:8,background:C.bg,border:`1px solid ${C.border}`,fontSize:11,color:C.dim,fontFamily:T.mono}}>…</div>
                </div>
              )}
            </div>
            {phase==="interview"&&(
              <div style={{padding:"0.9rem 1.2rem",borderTop:`1px solid ${C.border}`,display:"flex",gap:"0.6rem"}}>
                <input value={userInput} onChange={e=>setUserInput(e.target.value)}
                  onKeyDown={e=>e.key==="Enter"&&sendMessage()}
                  placeholder="Antwort eingeben…"
                  style={{flex:1,padding:"0.6rem 0.75rem",background:C.bg,border:`1px solid ${C.border}`,borderRadius:5,color:C.text,fontSize:11,fontFamily:T.mono,outline:"none"}} />
                <button onClick={sendMessage} disabled={!userInput.trim()||chatLoading}
                  style={{padding:"0.6rem 1rem",background:C.green,border:`1px solid ${C.greenb}`,borderRadius:5,color:C.accent,fontSize:11,fontFamily:T.mono,fontWeight:600,cursor:"pointer"}}>
                  →
                </button>
              </div>
            )}
            {phase==="done"&&(
              <div style={{padding:"1rem 1.2rem",borderTop:`1px solid ${C.border}`}}>
                <button onClick={handleImport}
                  style={{width:"100%",padding:"0.75rem",background:C.green,border:`1px solid ${C.greenb}`,borderRadius:7,color:C.accent,fontSize:11,fontFamily:T.mono,fontWeight:600,cursor:"pointer",letterSpacing:"0.1em"}}>
                  ✓ FELDER ÜBERNEHMEN & SCHLIESSEN
                </button>
              </div>
            )}
          </>
        )}
      </div>
    </div>
  );
}


// ─── PRAKTIKERMETHODE TAB ────────────────────────────────────────────────────
function TabPraktiker({svWert,ewWert}) {
  const praktiker=(svWert!==null&&ewWert!==null)?(2*ewWert+svWert)/3:null;
  const hatBeide=svWert!==null&&ewWert!==null;
  const items=[
    {l:"Ertragswert (netto)",v:ewWert,col:"#1e6f63",mult:2},
    {l:"Substanzwert (netto)",v:svWert,col:"#6b8a7a",mult:1},
  ];
  return (
    <div style={{maxWidth:560}}>
      <div style={{background:"#ffffff",border:"1px solid #dcdfe6",borderRadius:8,padding:"1.5rem",marginBottom:"1rem"}}>
        <div style={{fontSize:10.5,letterSpacing:"0.18em",color:"#1e6f63",textTransform:"uppercase",fontFamily:"IBM Plex Mono,monospace",marginBottom:"1.2rem"}}>Formel</div>
        <div style={{display:"flex",alignItems:"center",gap:"0.5rem",flexWrap:"wrap",marginBottom:"1.5rem"}}>
          {[["2 ×","dim"],["Ertragswert","accent"],["+","dim"],["Substanzwert","accent"],["÷ 3","dim"],["=","dim"],["Verkehrswert","result"]].map(([t,s],i)=>(
            <span key={i} style={{fontSize:s==="result"?"0.9rem":"0.85rem",fontFamily:s==="accent"||s==="result"?"IBM Plex Sans,sans-serif":"IBM Plex Mono,monospace",color:s==="result"?"#8a7530":s==="accent"?"#1c1f2a":"#b0b3bc",fontWeight:s==="result"||s==="accent"?600:400}}>{t}</span>
          ))}
        </div>
        {items.map((w,i)=>(
          <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"0.32rem 0",borderBottom:"1px solid #e8eaf0"}}>
            <span style={{fontSize:11,color:"#5a5d6a",fontFamily:"IBM Plex Mono,monospace"}}>{w.mult}× {w.l}</span>
            <span style={{fontSize:11,color:w.v?w.col:"#dcdfe6",fontFamily:"IBM Plex Mono,monospace"}}>{w.v?`CHF ${new Intl.NumberFormat("de-CH",{maximumFractionDigits:0}).format(Math.round(w.v*w.mult))}`:"–"}</span>
          </div>
        ))}
        {hatBeide&&(
          <div style={{display:"flex",justifyContent:"space-between",padding:"0.35rem 0.5rem",background:"#f4f5f8",borderRadius:4,margin:"0.6rem 0"}}>
            <span style={{fontSize:10,color:"#5a5d6a",fontFamily:"IBM Plex Mono,monospace"}}>Summe vor Division</span>
            <span style={{fontSize:10,color:"#1c1f2a",fontFamily:"IBM Plex Mono,monospace",fontWeight:600}}>CHF {new Intl.NumberFormat("de-CH",{maximumFractionDigits:0}).format(Math.round(2*ewWert+svWert))}</span>
          </div>
        )}
        <div style={{display:"flex",justifyContent:"space-between",padding:"0.32rem 0",borderBottom:"1px solid #e8eaf0"}}>
          <span style={{fontSize:11,color:"#5a5d6a",fontFamily:"IBM Plex Mono,monospace"}}>÷ 3</span>
          <span style={{fontSize:11,color:"#9a9da8",fontFamily:"IBM Plex Mono,monospace"}}>Mittelwertgewichtung</span>
        </div>
        <div style={{marginTop:"1.2rem",display:"flex",justifyContent:"space-between",alignItems:"center",padding:"0.75rem",background:hatBeide?"#e8d090":"#eef0f4",border:`1px solid ${hatBeide?"#d8b860":"#e8eaf0"}`,borderRadius:6}}>
          <span style={{fontSize:12,color:hatBeide?"#1c1f2a":"#b0b3bc",fontFamily:"IBM Plex Mono,monospace",fontWeight:600}}>Verkehrswert (Praktiker)</span>
          <span style={{fontSize:"1.3rem",color:hatBeide?"#8a7530":"#dcdfe6",fontFamily:"IBM Plex Mono,monospace",fontWeight:600}}>{hatBeide?`CHF ${new Intl.NumberFormat("de-CH",{maximumFractionDigits:0}).format(Math.round(praktiker))}`:"–"}</span>
        </div>
        {!hatBeide&&(
          <div style={{marginTop:"0.85rem",padding:"0.65rem",background:"#f4f5f8",borderRadius:5,fontSize:10,color:"#9a9da8",fontFamily:"IBM Plex Mono,monospace",lineHeight:1.8}}>
            {!svWert&&<div>⚠ Substanzwert noch nicht berechnet → Tab "Substanzwert" ausfüllen</div>}
            {!ewWert&&<div>⚠ Ertragswert noch nicht berechnet → Tab "Ertragswert" ausfüllen</div>}
          </div>
        )}
      </div>
      {hatBeide&&(
        <div style={{display:"grid",gridTemplateColumns:"1fr 1fr",gap:"0.6rem"}}>
          <div style={{padding:"0.65rem 0.9rem",background:"#f4f5f8",borderRadius:5,textAlign:"center"}}>
            <div style={{fontSize:10.5,color:"#9a9da8",fontFamily:"IBM Plex Mono,monospace",marginBottom:3,textTransform:"uppercase",letterSpacing:"0.1em"}}>Ertragswert-Anteil</div>
            <div style={{fontSize:"0.95rem",color:"#1e6f63",fontFamily:"IBM Plex Mono,monospace",fontWeight:600}}>{((2*ewWert/(2*ewWert+svWert))*100).toFixed(1)}%</div>
          </div>
          <div style={{padding:"0.65rem 0.9rem",background:"#f4f5f8",borderRadius:5,textAlign:"center"}}>
            <div style={{fontSize:10.5,color:"#9a9da8",fontFamily:"IBM Plex Mono,monospace",marginBottom:3,textTransform:"uppercase",letterSpacing:"0.1em"}}>Substanzwert-Anteil</div>
            <div style={{fontSize:"0.95rem",color:"#6b8a7a",fontFamily:"IBM Plex Mono,monospace",fontWeight:600}}>{((svWert/(2*ewWert+svWert))*100).toFixed(1)}%</div>
          </div>
        </div>
      )}
    </div>
  );
}
// ─── HAUPT-APP ────────────────────────────────────────────────────────────────
const emptySv = () => ({
  ek:"",jg:"",
  deb:"",vor:"",ang:"",traA:"",
  srDelk:"",srAa:"",srVor:"",srForder:"",
  avBw:"",avVk:"",nbBw:"",nbVk:"",
  traP:"",rueck:"",
  div:"",
  srDelkOpen:false,srDelkBilanz:"",srDelkRecht:"",
  debOpen:false,debA:"",debB:"",
  vorOpen:false,vorA:"",vorB:"",
  angOpen:false,angA:"",angB:"",
  traAOpen:false,traAA:"",traAB:"",
  srAaOpen:false,srAaA:"",srAaB:"",
  srVorOpen:false,srVorA:"",srVorB:"",
  srForderOpen:false,srForderA:"",srForderB:"",
  traPOpen:false,traPA:"",traPB:"",
  rueckOpen:false,rueckA:"",rueckB:"",
});
const emptyEw = () => ({branche:"",risiko:"mittel",zOvr:"",j1:emptyJ(),j2:emptyJ(),j3:emptyJ(),z2:false,z3:false,zbOffen:false,zbBasis:"",zbGroesse:"",zbFluk:"",zbVerk:"",zbWett:"",zbRecht:"",svvjOpen:false,svvjSrDelk:"",svvjSrAa:"",svvjSrVor:"",svvjSrForder:"",svvjAvBw:"",svvjAvVk:"",svvjTraP:"",svvjRueck:""});
const emptyMu = () => ({branche:"",maKl:"",mOvr:"",gew:"",st:"",zi:"",aoA:"",aoE:"",lA:"",lM:"",srVj:"",srA:""});

const TABS=[
  {k:"substanz",l:"1. Substanzwert",s:"netto",gratis:true},
  {k:"ertrag",l:"2. Ertragswert",s:"netto",gratis:false},
  {k:"praktiker",l:"3. Praktiker",s:"(2×EW+SW)÷3",gratis:false},
  {k:"multiple",l:"4. Multiple",s:"EBITC",gratis:false},
];

function UpsellModal({onClose,onBuy}) {
  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.75)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:"1rem"}}
      onClick={onClose}>
      <div style={{background:C.card,border:`1px solid #9ad0c2`,borderRadius:12,padding:"2rem",maxWidth:420,width:"100%",boxShadow:"0 0 60px rgba(30,111,99,0.12)"}}
        onClick={e=>e.stopPropagation()}>
        <div style={{fontSize:10.5,letterSpacing:"0.2em",color:"#8a7530",textTransform:"uppercase",fontFamily:T.mono,marginBottom:"0.5rem"}}>Vollbericht · CHF 49</div>
        <h2 style={{fontSize:"1.4rem",color:C.text,fontFamily:T.sans,fontWeight:600,marginBottom:"0.6rem",lineHeight:1.3}}>Alle 4 Methoden freischalten</h2>
        <p style={{fontSize:11,color:C.muted,fontFamily:T.mono,marginBottom:"1.5rem",lineHeight:1.8}}>
          Mit dem Vollbericht erhältst du:<br/>
          <span style={{color:C.accent}}>✓</span> Ertragswert (Kapitalisierungsmethode)<br/>
          <span style={{color:C.accent}}>✓</span> Multiple-Methode (EBITC × Branchenmultiple)<br/>
          <span style={{color:C.accent}}>✓</span> Praktiker (automatisch berechnet)<br/>
          <span style={{color:C.accent}}>✓</span> PDF mit Wertbandbreite Min/Max Grafik
        </p>
        <button onClick={onBuy}
          style={{width:"100%",padding:"0.85rem",background:C.green,border:`1px solid ${C.greenb}`,borderRadius:7,color:C.accent,fontSize:12,fontFamily:T.mono,fontWeight:600,cursor:"pointer",letterSpacing:"0.1em",marginBottom:"0.6rem"}}>
          CHF 49 – JETZT FREISCHALTEN
        </button>
        <button onClick={onClose}
          style={{width:"100%",padding:"0.55rem",background:"none",border:"none",color:C.dim,fontSize:10,fontFamily:T.mono,cursor:"pointer"}}>
          Abbrechen
        </button>
        <div style={{marginTop:"0.8rem",fontSize:10.5,color:"#dcdfe6",fontFamily:T.mono,textAlign:"center"}}>
          Einmalige Zahlung · Kein Abo · Sofort-Download
        </div>
      </div>
    </div>
  );
}

function App() {
  const [tab,setTab]=useState("substanz");
  const [bezahlt,setBezahlt]=useState(false);
  const [modal,setModal]=useState(false);
  const [rf,setRf]=useState("");
  const [kt,setKt]=useState("");
  const [stCust,setStCust]=useState("");
  const [sv,setSv]=useState(emptySv());
  const [ew,setEw]=useState(emptyEw());
  const [mu,setMu]=useState(emptyMu());

  const ktObj=KANTONE.find(k=>k.k===kt);
  const steuersatz=stCust!==""?num(stCust):(ktObj?.s??0);

  // Berechne Endergebnisse für Panel
  const srAV=Math.max(0,num(sv.avVk)-num(sv.avBw));
  const nbSR=Math.max(0,num(sv.nbVk)-num(sv.nbBw));
  const nbZ=nbSR*0.5;
  const uvAbzug=num(sv.deb)+num(sv.vor)+num(sv.ang)+num(sv.traA);
  const passivenZuschlag=num(sv.traP)+num(sv.rueck);
  const ltPassiven=passivenZuschlag*(steuersatz/100);
  const ltAV=srAV*(steuersatz/100);
  const lt=ltPassiven+ltAV;
  const svWert=num(sv.ek)+num(sv.jg)-uvAbzug+passivenZuschlag+srAV-lt+nbZ-num(sv.div);
  const hatSV=sv.ek!=="";

  const calcJ=d=>{const ex=num(d.gewinn)+num(d.steuern),sr=num(d.srAkt)-num(d.srVj),lb=num(d.lohnAkt)-num(d.lohnMkt),ao=num(d.aoAuf)-num(d.aoErt),inn=ex+sr+lb+ao;return inn-inn*(steuersatz/100);};
  const g1=calcJ(ew.j1),g2=ew.z2?calcJ(ew.j2):null,g3=ew.z3?calcJ(ew.j3):null;
  const gD=!ew.z2?g1:!ew.z3?(g1*2+g2)/3:(g1*3+g2*2+g3)/6;
  const bEw=BRANCHEN_EW.find(b=>b.v===ew.branche);
  const zEff=ew.zOvr!==""?num(ew.zOvr):clamp((bEw?.z??12)+RISIKO_DELTA[ew.risiko],8,18);
  const ewWert=zEff>0?(gD/(zEff/100)):0;
  const hatEW=ew.j1.gewinn!=="";

  const mVors=MULTIPLES_CH[mu.branche]?.[mu.maKl]??null;
  const mEff=mu.mOvr!==""?num(mu.mOvr):(mVors??0);
  const ebitc=num(mu.gew)+num(mu.st)+num(mu.zi)+num(mu.aoA)-num(mu.aoE)+(num(mu.lA)-num(mu.lM))+(num(mu.srA)-num(mu.srVj));
  const muWert=ebitc>0&&mEff>0?ebitc*mEff:0;
  const hatMU=mu.gew!=="";

  return (
    <div className="app-padding" style={{minHeight:"100vh",background:C.bg,padding:"3rem 1.5rem"}}>
      <div style={{maxWidth:960,margin:"0 auto"}}>

        {/* Header */}
        <div className="app-header" style={{marginBottom:"2.5rem"}}>
          <div style={{fontSize:10.5,letterSpacing:"0.22em",color:C.accent,textTransform:"uppercase",marginBottom:"0.5rem",fontFamily:T.mono}}>Schweizer KMU · Bewertungstool</div>
          <h1 style={{fontSize:"2.4rem",fontWeight:600,color:C.text,margin:0,letterSpacing:"-0.025em",fontFamily:T.sans}}>easyValue</h1>
          <p style={{color:C.dim,fontSize:13,marginTop:"0.5rem",fontFamily:T.mono}}>einfache Bewertung für Ihr Unternehmen</p>
        </div>

        {/* Gemeinsame Stammdaten */}
        <div className="app-card" style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:"1.4rem 1.6rem",marginBottom:"1.8rem",boxShadow:"0 1px 3px rgba(28,31,42,0.04)"}}>
          <div style={{fontSize:10.5,letterSpacing:"0.18em",color:C.dim,textTransform:"uppercase",fontFamily:T.mono,marginBottom:"0.85rem",display:"flex",alignItems:"center"}}>
            <span>Ihre Unternehmensdaten</span>
            <InfoTip>Die eingegebenen Daten werden automatisch in alle Bewertungsmethoden übernommen.</InfoTip>
          </div>
          <div className="responsive-3col" style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"0.9rem"}}>
            <Row label="Rechtsform"><Sel value={rf} onChange={setRf} options={RECHTSFORMEN.map(r=>({v:r,l:r}))} placeholder="Rechtsform wählen…" /></Row>
            <Row label="Kanton (Steuerdomizil)"><Sel value={kt} onChange={v=>{setKt(v);setStCust("");}} options={KANTONE.map(k=>({v:k.k,l:`${k.k} – ${k.n}`}))} placeholder="Kanton wählen…" /></Row>
            <Row label="Steuersatz" hint="inkl. direkte Bundessteuer · anpassbar">
              <Inp value={stCust!==""?stCust:ktObj?.s??""} onChange={setStCust} prefix="%" placeholder={ktObj?ktObj.s.toFixed(2):"Kanton wählen"} />
            </Row>
          </div>
        </div>

        {/* Tabs */}
        <div className="tabs-row" style={{display:"flex",gap:4,marginBottom:"1.8rem",background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:"0.35rem",boxShadow:"0 1px 3px rgba(28,31,42,0.04)"}}>
          {TABS.map(t=>{
            const gesperrt=!t.gratis&&!bezahlt;
            const aktiv=tab===t.k&&!gesperrt;
            return (
              <button key={t.k} className="tab-btn"
                onClick={()=>{ if(gesperrt){setModal(true);}else{setTab(t.k);} }}
                style={{flex:1,padding:"0.75rem 0.55rem",border:"none",borderRadius:7,cursor:"pointer",background:aktiv?C.green:"transparent",transition:"all 0.2s",textAlign:"center",position:"relative",opacity:gesperrt?0.55:1,boxShadow:aktiv?"0 1px 2px rgba(30,111,99,0.08)":"none"}}>
                <div style={{fontSize:11,letterSpacing:"0.08em",color:aktiv?C.accent:gesperrt?"#b0b3bc":C.dim,fontFamily:T.mono,fontWeight:aktiv?600:500,textTransform:"uppercase"}}>
                  {gesperrt?"🔒 ":""}{t.l}
                </div>
                <div style={{fontSize:10,color:aktiv?"#2a6a60":"#b0b3bc",fontFamily:T.mono,marginTop:3}}>{gesperrt?"CHF 49":t.s}</div>
              </button>
            );
          })}
        </div>

        {/* Tab-Inhalt */}
        {tab==="substanz"&&<TabSV steuersatz={steuersatz} sv={sv} setSv={setSv} />}
        {tab==="ertrag"&&<TabEW steuersatz={steuersatz} ew={ew} setEw={setEw} sv={sv} />}
        {tab==="multiple"&&<TabMU mu={mu} setMu={setMu} />}
        {tab==="praktiker"&&<TabPraktiker svWert={hatSV?svWert:null} ewWert={hatEW?ewWert:null} />}

        {/* Ergebnis */}
        <ErgebnisPanel sv={hatSV?svWert:null} ew={hatEW?ewWert:null} mu={hatMU?muWert:null} />

        {/* PDF Buttons */}
        <div className="responsive-pdf" style={{marginTop:"2rem",display:"flex",gap:"1rem",flexWrap:"wrap"}}>
          <div style={{flex:1,minWidth:220,background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:"1.3rem",boxShadow:"0 1px 3px rgba(28,31,42,0.04)"}}>
            <div style={{fontSize:10.5,letterSpacing:"0.15em",color:C.accent,textTransform:"uppercase",fontFamily:T.mono,marginBottom:"0.4rem"}}>Gratis</div>
            <div style={{fontSize:13,color:C.text,fontFamily:T.sans,fontWeight:600,marginBottom:"0.3rem"}}>Substanzwert-Bericht</div>
            <div style={{fontSize:10,color:C.dim,fontFamily:T.mono,marginBottom:"0.9rem"}}>PDF mit Substanzwert-Berechnung</div>
            <a href="bericht_substanzwert.pdf" target="_blank"
              style={{display:"block",textAlign:"center",padding:"0.6rem",background:C.green,border:`1px solid ${C.greenb}`,borderRadius:5,color:C.accent,fontSize:11,fontFamily:T.mono,fontWeight:600,textDecoration:"none",letterSpacing:"0.08em"}}>
              PDF ÖFFNEN ↗
            </a>
          </div>
          <div style={{flex:1,minWidth:220,background:C.card,border:`1px solid ${bezahlt?"#9ad0c2":C.border}`,borderRadius:10,padding:"1.3rem",opacity:bezahlt?1:0.75,boxShadow:"0 1px 3px rgba(28,31,42,0.04)"}}>
            <div style={{fontSize:10.5,letterSpacing:"0.15em",color:"#8a7530",textTransform:"uppercase",fontFamily:T.mono,marginBottom:"0.4rem"}}>{bezahlt?"✓ Freigeschaltet":"CHF 49 · Vollbericht"}</div>
            <div style={{fontSize:13,color:C.text,fontFamily:T.sans,fontWeight:600,marginBottom:"0.3rem"}}>Alle 4 Methoden + Grafik</div>
            <div style={{fontSize:10,color:C.dim,fontFamily:T.mono,marginBottom:"0.9rem"}}>Bandbreite Min/Max · Detailberechnungen</div>
            {bezahlt?(
              <a href="bericht_vollstaendig.pdf" target="_blank"
                style={{display:"block",textAlign:"center",padding:"0.6rem",background:"#fef3d8",border:"1px solid #d8b860",borderRadius:5,color:"#8a7530",fontSize:11,fontFamily:T.mono,fontWeight:600,textDecoration:"none",letterSpacing:"0.08em"}}>
                PDF ÖFFNEN ↗
              </a>
            ):(
              <button onClick={()=>setModal(true)}
                style={{width:"100%",padding:"0.6rem",background:C.bg,border:`1px solid ${C.border}`,borderRadius:5,color:C.dim,fontSize:11,fontFamily:T.mono,fontWeight:600,cursor:"pointer",letterSpacing:"0.08em"}}>
                🔒 CHF 49 – FREISCHALTEN
              </button>
            )}
          </div>
        </div>

        {/* Zahlung simulieren (nur für Test) */}
        {!bezahlt&&(
          <div style={{marginTop:"0.8rem",padding:"0.75rem 1rem",background:"#fef9f0",border:"1px dashed #e8c890",borderRadius:6,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <span style={{fontSize:10,color:"#7a6520",fontFamily:T.mono}}>🧪 Testmodus · Zahlung simulieren</span>
            <button onClick={()=>{setBezahlt(true);setModal(false);setTab("ertrag");}}
              style={{padding:"0.4rem 0.9rem",background:"#e8d090",border:"1px solid #d8b860",borderRadius:4,color:"#7a6520",fontSize:10,fontFamily:T.mono,cursor:"pointer",fontWeight:600}}>
              Zahlung simulieren →
            </button>
          </div>
        )}
        {bezahlt&&(
          <div style={{marginTop:"0.8rem",padding:"0.6rem 1rem",background:"#e8f5ec",border:"1px dashed #9ad0a8",borderRadius:6,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
            <span style={{fontSize:10,color:"#3a6a4a",fontFamily:T.mono}}>✓ Vollbericht freigeschaltet · Alle Tabs verfügbar</span>
            <button onClick={()=>{setBezahlt(false);setTab("substanz");}}
              style={{padding:"0.4rem 0.9rem",background:"none",border:"1px solid #9ad0a8",borderRadius:4,color:"#3a6a4a",fontSize:10,fontFamily:T.mono,cursor:"pointer"}}>
              Reset
            </button>
          </div>
        )}

        {modal&&<UpsellModal onClose={()=>setModal(false)} onBuy={()=>{setBezahlt(true);setModal(false);setTab("ertrag");}} />}

        <div style={{marginTop:"1.3rem",fontSize:11,color:"#dcdfe6",fontFamily:T.mono,textAlign:"center",lineHeight:1.7}}>
          Swiss KMU Bewertungstool · Steuersätze: PwC 2025 · Multiples: NIMBO CH März 2026
        </div>

      </div>
    </div>
  );
}

ReactDOM.createRoot(document.getElementById("root")).render(<App />);
</script>
</body>
</html>
