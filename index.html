<!DOCTYPE html>
<html lang="de">
<head>

<style>

  input[type=number]::-webkit-inner-spin-button,
  input[type=number]::-webkit-outer-spin-button { -webkit-appearance: none; }
  input[type=range] { accent-color: #1e6f63; }
  select option { background: #ffffff; color: #1c1f2a; }
  ::-webkit-scrollbar { width: 6px; }
  ::-webkit-scrollbar-track { background: #eef0f4; }
  ::-webkit-scrollbar-thumb { background: #c0c4cc; border-radius: 3px; }

  @media (max-width: 768px) {
    .app-padding { padding: 1.5rem 0.9rem !important; }
    .app-header h1 { font-size: 1.8rem !important; }
    .app-card { padding: 1rem 1.1rem !important; }
    .app-card-lg { padding: 1.1rem !important; }

    .bandbreite-row .bandbreite-label { width: 80px !important; font-size: 9.5px !important; }
    .bandbreite-row .bandbreite-value { width: 80px !important; font-size: 9.5px !important; }
    .jahre-tabelle { font-size: 10px !important; }
    .jahre-tabelle input { font-size: 12px !important; padding: 0.4rem 0.5rem !important; }
  }
</style>
</head>
<body>
<div id="root"></div>

<script type="text/babel">
const { useState, useMemo, useCallback } = React;

// ─── Daten ────────────────────────────────────────────────────────────────────
const KANTONE = [
  {k:"AG",n:"Aargau",s:15.03},{k:"AI",n:"Appenzell Innerrhoden",s:12.66},
  {k:"AR",n:"Appenzell Ausserrhoden",s:13.04},{k:"BE",n:"Bern",s:20.54},
  {k:"BL",n:"Basel-Landschaft",s:12.63},{k:"BS",n:"Basel-Stadt",s:13.04},
  {k:"FR",n:"Freiburg",s:14.12},{k:"GE",n:"Genf",s:14.70},
  {k:"GL",n:"Glarus",s:12.32},{k:"GR",n:"Graubünden",s:14.77},
  {k:"JU",n:"Jura",s:14.80},{k:"LU",n:"Luzern",s:11.91},
  {k:"NE",n:"Neuenburg",s:14.89},{k:"NW",n:"Nidwalden",s:11.97},
  {k:"OW",n:"Obwalden",s:12.74},{k:"SG",n:"St. Gallen",s:14.29},
  {k:"SH",n:"Schaffhausen",s:15.08},{k:"SO",n:"Solothurn",s:15.29},
  {k:"SZ",n:"Schwyz",s:13.45},{k:"TG",n:"Thurgau",s:13.21},
  {k:"TI",n:"Tessin",s:16.05},{k:"UR",n:"Uri",s:12.64},
  {k:"VD",n:"Waadt",s:14.72},{k:"VS",n:"Wallis",s:16.98},
  {k:"ZG",n:"Zug",s:11.85},{k:"ZH",n:"Zürich",s:19.61},
];
const RECHTSFORMEN = ["AG","GmbH","Einzelfirma","Kollektivgesellschaft","Andere"];
const BRANCHEN_EW = [
  {v:"it",l:"Beratung / Treuhand / IT",z:10.0},
  {v:"dl",l:"Arzt / Zahnarzt / Therapie / Pflege",z:10.5},
  {v:"arch",l:"Architekt / Ingenieur / Planer",z:11.0},
  {v:"prod",l:"Produktion / Fertigung / Werkstatt",z:12.0},
  {v:"transport",l:"Transport / Spedition / Garage",z:12.5},
  {v:"handel",l:"Detailhandel / Laden / Shop",z:13.0},
  {v:"bau",l:"Bau / Renovation / Handwerk",z:13.0},
  {v:"coiff",l:"Coiffeur / Kosmetik / Reinigung",z:13.5},
  {v:"gastro",l:"Restaurant / Café / Hotel",z:14.0},
  {v:"landw",l:"Landwirtschaft / Gärtnerei",z:13.0},
  {v:"andere",l:"Andere",z:12.0},
];
const BRANCHEN_MU = [
  {v:"it",l:"Beratung / Treuhand / IT"},
  {v:"prod",l:"Produktion / Fertigung / Werkstatt"},
  {v:"dl",l:"Dienstleistung (inkl. Arzt / Therapie)"},
  {v:"gastro",l:"Restaurant / Café / Hotel"},
  {v:"handel",l:"Detailhandel / Laden / Shop"},
  {v:"bau",l:"Bau / Renovation / Handwerk"},
];
const MA_KLASSEN = [
  {v:"2-5",l:"2–5 Mitarbeitende"},
  {v:"6-25",l:"6–25 Mitarbeitende"},
  {v:"26-99",l:"26–99 Mitarbeitende"},
];
const MULTIPLES_CH = {
  it:{     "2-5":3.9,"6-25":5.6,"26-99":6.6},
  prod:{   "2-5":3.5,"6-25":4.9,"26-99":5.8},
  dl:{     "2-5":3.2,"6-25":4.6,"26-99":5.4},
  gastro:{ "2-5":3.3,"6-25":4.7,"26-99":5.6},
  handel:{ "2-5":2.9,"6-25":4.1,"26-99":4.9},
  bau:{    "2-5":2.7,"6-25":3.8,"26-99":4.5},
};
const RISIKO_DELTA = {tief:-1.5,mittel:0,hoch:1.5};

// ─── Utils ────────────────────────────────────────────────────────────────────
const fmt = v => {
  if(v===null||v===undefined||v==="") return "–";
  const n = typeof v==="string"?parseFloat(v):v;
  if(isNaN(n)) return "–";
  return "CHF "+new Intl.NumberFormat("de-CH",{maximumFractionDigits:0}).format(Math.round(n));
};
const num = v => { const n=parseFloat(String(v).replace(/[^0-9.-]/g,"")); return isNaN(n)?0:n; };
const clamp = (v,a,b) => Math.min(Math.max(v,a),b);

// ─── UI ───────────────────────────────────────────────────────────────────────
const T = {mono:"'IBM Plex Mono',monospace", sans:"'IBM Plex Sans',sans-serif"};
const C = {bg:"#f4f5f8",card:"#ffffff",border:"#dcdfe6",accent:"#1e6f63",text:"#1c1f2a",muted:"#4a4d5a",dim:"#7a7d8a",neg:"#a14a2a",green:"#e8f5f1",greenb:"#9ad0c2"};

const InfoTip = ({children}) => {
  const [open,setOpen] = useState(false);
  return (
    <span style={{position:"relative",display:"inline-block",marginLeft:6,verticalAlign:"middle"}}>
      <button type="button" onClick={e=>{e.stopPropagation();setOpen(!open);}}
        style={{width:14,height:14,borderRadius:"50%",border:`1px solid ${C.dim}`,background:open?C.accent:"transparent",color:open?"#fff":C.dim,fontSize:9,cursor:"pointer",display:"inline-flex",alignItems:"center",justifyContent:"center",padding:0,lineHeight:1,fontFamily:T.sans,fontWeight:600,fontStyle:"italic"}}>i</button>
      {open && (
        <>
          <div onClick={()=>setOpen(false)} style={{position:"fixed",inset:0,zIndex:50,background:"transparent"}} />
          <div style={{position:"absolute",top:"calc(100% + 6px)",left:0,zIndex:51,background:C.card,border:`1px solid ${C.accent}`,borderRadius:6,padding:"0.7rem 0.9rem",width:280,boxShadow:"0 4px 16px rgba(0,0,0,0.12)",fontSize:11,color:C.muted,fontFamily:T.mono,lineHeight:1.5,textTransform:"none",letterSpacing:"normal",fontWeight:400}}>{children}</div>
        </>
      )}
    </span>
  );
};
const Lbl = ({children,hint}) => (
  <div style={{marginBottom:"0.3rem",display:"flex",alignItems:"center"}}>
    <span style={{fontSize:10,letterSpacing:"0.1em",color:C.muted,textTransform:"uppercase",fontFamily:T.mono}}>{children}</span>
    {hint&&<InfoTip>{hint}</InfoTip>}
  </div>
);
const Inp = ({value,onChange,prefix="CHF",placeholder="0",positiveOnly=false}) => {
  const isPct = prefix === "%";
  const display = (()=>{
    if(isPct) return value;
    if(value===""||value===null||value===undefined) return "";
    const str = String(value);
    if(str==="-") return "-";
    const dotIdx = str.indexOf(".");
    const intStr = dotIdx>=0 ? str.slice(0,dotIdx) : str;
    const decStr = dotIdx>=0 ? str.slice(dotIdx) : "";
    const intClean = intStr.replace(/[^0-9-]/g,"");
    if(intClean===""||intClean==="-") return intClean+decStr;
    const n = parseInt(intClean,10);
    if(isNaN(n)) return str;
    return new Intl.NumberFormat("de-CH",{maximumFractionDigits:0}).format(n)+decStr;
  })();
  const handleChange = e => {
    const v = e.target.value.replace(/,/g,".");
    if(isPct){
      onChange(v.replace(/[^0-9.]/g,"").replace(/(\..*)\./g,"$1"));
      return;
    }
    const cleaned = v.replace(/[^0-9.-]/g,"").replace(/(?!^)-/g,"").replace(/(\..*)\./g,"$1");
    onChange(cleaned);
  };
  const isNeg = positiveOnly && String(value).startsWith("-") && value!=="-";
  return (
    <div>
      <div style={{display:"flex",alignItems:"center",background:C.card,border:`1px solid ${isNeg?C.neg:C.border}`,borderRadius:5,overflow:"hidden"}}>
        {prefix&&<span style={{padding:"0 8px",color:C.dim,fontSize:10,fontFamily:T.mono,borderRight:`1px solid ${isNeg?C.neg:C.border}`,whiteSpace:"nowrap"}}>{prefix}</span>}
        <input type="text" inputMode="decimal" value={display} onChange={handleChange} onWheel={e=>e.target.blur()} placeholder={placeholder}
          style={{flex:1,padding:"0.6rem 0.7rem",background:"transparent",border:"none",outline:"none",color:isNeg?C.neg:C.text,fontSize:14,fontFamily:T.mono}} />
      </div>
      {isNeg&&<div style={{fontSize:10,color:C.neg,fontFamily:T.mono,marginTop:3,letterSpacing:"0.03em"}}>⚠ Bitte positiven Betrag eingeben</div>}
    </div>
  );
};
const HerleitungBlock = ({open,onToggle,formula,labelA,hintA,valueA,onChangeA,labelB,hintB,valueB,onChangeB,resultLabel,onApply}) => {
  const result = Math.max(0, num(valueA)-num(valueB));
  return (
    <>
      <button onClick={onToggle}
        style={{marginTop:"0.4rem",padding:"0.4rem 0.7rem",background:open?C.green:"transparent",border:`1px dashed ${open?C.greenb:C.border}`,borderRadius:5,color:open?C.accent:C.dim,fontSize:10,letterSpacing:"0.08em",textTransform:"uppercase",fontFamily:T.mono,cursor:"pointer"}}>
        {open?"▾":"▸"} Herleitung berechnen
      </button>
      {open&&(
        <div style={{marginTop:"0.5rem",padding:"0.9rem 1rem",background:C.bg,borderRadius:6,display:"flex",flexDirection:"column",gap:"0.6rem"}}>
          <div style={{fontSize:10.5,color:C.dim,fontFamily:T.mono,lineHeight:1.6}}>{formula}</div>
          <Row label={labelA} hint={hintA}><Inp value={valueA} onChange={onChangeA} positiveOnly /></Row>
          <Row label={labelB} hint={hintB}><Inp value={valueB} onChange={onChangeB} positiveOnly /></Row>
          <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"0.5rem 0.7rem",background:C.card,border:`1px solid ${C.greenb}`,borderRadius:5}}>
            <span style={{fontSize:10.5,color:C.muted,fontFamily:T.mono,letterSpacing:"0.08em",textTransform:"uppercase"}}>= {resultLabel}</span>
            <span style={{fontSize:"0.95rem",color:C.accent,fontFamily:T.mono,fontWeight:600}}>{result>0?fmt(result):"–"}</span>
          </div>
          {result>0&&<button onClick={()=>{onApply(String(result));onToggle();}}
            style={{padding:"0.55rem 0.8rem",background:C.accent,border:"none",borderRadius:5,color:"#fff",fontSize:10.5,letterSpacing:"0.08em",textTransform:"uppercase",fontFamily:T.mono,fontWeight:600,cursor:"pointer"}}>
            → In Hauptfeld übernehmen
          </button>}
        </div>
      )}
    </>
  );
};
const Sel = ({value,onChange,options,placeholder}) => (
  <div style={{position:"relative"}}>
    <select value={value} onChange={e=>onChange(e.target.value)}
      style={{width:"100%",padding:"0.6rem 1.8rem 0.6rem 0.7rem",background:C.card,border:`1px solid ${C.border}`,borderRadius:5,color:value?C.text:C.dim,fontSize:13,fontFamily:T.mono,appearance:"none",cursor:"pointer",outline:"none"}}>
      <option value="">{placeholder}</option>
      {options.map(o=><option key={o.v??o} value={o.v??o}>{o.l??o}</option>)}
    </select>
    <span style={{position:"absolute",right:10,top:"50%",transform:"translateY(-50%)",color:C.accent,pointerEvents:"none",fontSize:9}}>▼</span>
  </div>
);
const Sec = ({title,accent,hint,color,children}) => (
  <div style={{marginBottom:"1.5rem"}}>
    <div style={{fontSize:10.5,letterSpacing:"0.18em",textTransform:"uppercase",color:color||(accent?C.accent:C.dim),fontFamily:T.mono,marginBottom:"0.8rem",paddingBottom:"0.35rem",borderBottom:`1px solid ${color?color+"33":(accent?"#e8f5f1":C.bg)}`,display:"flex",alignItems:"center"}}>
      <span>{title}</span>
      {hint&&<InfoTip>{hint}</InfoTip>}
    </div>
    <div style={{display:"flex",flexDirection:"column",gap:"0.8rem"}}>{children}</div>
  </div>
);
const Row = ({label,hint,children}) => <div><Lbl hint={hint}>{label}</Lbl>{children}</div>;
const Auto = ({label,value,hl,warn}) => (
  <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"0.28rem 0.55rem",background:hl?"#e8f5f1":C.bg,border:hl?"1px solid #9ad0c2":"none",borderRadius:4}}>
    <span style={{fontSize:11,color:warn?C.neg:hl?"#1c1f2a":C.dim,fontFamily:T.mono,fontWeight:hl?600:400}}>{label}</span>
    <span style={{fontSize:11,color:warn?C.neg:hl?C.accent:C.muted,fontFamily:T.mono,fontWeight:hl?600:500}}>{fmt(value)}</span>
  </div>
);
const Div = () => <div style={{borderTop:`1px dashed ${C.bg}`,margin:"0.1rem 0"}} />;
const SubH = ({children}) => <div style={{fontSize:11,color:C.dim,letterSpacing:"0.1em",textTransform:"uppercase",fontFamily:T.mono}}>{children}</div>;

// ─── JahrBlock ────────────────────────────────────────────────────────────────
const emptyJ = () => ({gewinn:"",steuern:"",srVj:"",srAkt:"",lohnAkt:"",lohnMkt:"",aoAuf:"",aoErt:""});

function JahrBlock({label,data,onChange,steuersatz}) {
  const set = f => v => onChange({...data,[f]:v});
  const ebtEx = num(data.gewinn)+num(data.steuern);
  const srV   = num(data.srAkt)-num(data.srVj);
  const lohnB = num(data.lohnAkt)-num(data.lohnMkt);
  const aoN   = num(data.aoAuf)-num(data.aoErt);
  const ebtIn = ebtEx+srV+lohnB+aoN;
  const steuer= ebtIn*(steuersatz/100);
  const effG  = ebtIn-steuer;
  const hatSR = data.srVj!==""||data.srAkt!=="";
  const hatL  = data.lohnAkt!==""||data.lohnMkt!=="";
  const srLbl = srV>=0?"= Zunahme stille Reserven":"= Abnahme stille Reserven";
  const lLbl  = lohnB>0?"= Lohn überhöht → addiert":lohnB<0?"= Lohn zu tief → subtrahiert":"= Lohn marktgerecht";

  return (
    <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:6,padding:"0.9rem",marginBottom:"0.45rem"}}>
      <div style={{fontSize:10.5,letterSpacing:"0.13em",color:C.accent,textTransform:"uppercase",marginBottom:"0.85rem",fontFamily:T.mono}}>{label}</div>
      <div style={{display:"flex",flexDirection:"column",gap:"0.7rem"}}>
        <Row label="Jahresgewinn gemäss Erfolgsrechnung"><Inp value={data.gewinn} onChange={set("gewinn")} /></Row>
        <Row label="+ Steuern" hint="Bezahlte Gewinnsteuern dieser Periode"><Inp value={data.steuern} onChange={set("steuern")} /></Row>
        <Auto label="= EBT extern" value={ebtEx} />
        <Div/>
        <SubH>+/− Veränderung stille Reserven</SubH>
        <Row label="Stille Reserven Vorjahr" hint="Geschätzter Gesamtbetrag – z.B. Buchwert/Marktwert Fahrzeuge, Lager, Maschinen"><Inp value={data.srVj} onChange={set("srVj")} /></Row>
        <Row label="Stille Reserven aktuelles Jahr" hint="Gleiche Berechnung per Ende aktueller Periode"><Inp value={data.srAkt} onChange={set("srAkt")} /></Row>
        {hatSR&&<Auto label={srLbl} value={srV} />}
        <Div/>
        <SubH>+/− Unternehmerlohnbereinigung</SubH>
        <Row label="Aktueller Unternehmerlohn" hint="Effektiv bezogener Lohn inkl. Sozialleistungen"><Inp value={data.lohnAkt} onChange={set("lohnAkt")} /></Row>
        <Row label="Marktgerechter Lohn" hint="Lohn eines externen Geschäftsführers für diese Funktion"><Inp value={data.lohnMkt} onChange={set("lohnMkt")} /></Row>
        {hatL&&<Auto label={lLbl} value={lohnB} />}
        <Div/>
        <SubH>+/− Ausserordentliches / Betriebsfremdes</SubH>
        <Row label="Einmaliger Aufwand (wird addiert)" hint="z.B. Restrukturierungskosten, Sonderabschreibung"><Inp value={data.aoAuf} onChange={set("aoAuf")} /></Row>
        <Row label="Einmaliger Ertrag (wird subtrahiert)" hint="z.B. Liegenschaftsverkauf, Subventionen"><Inp value={data.aoErt} onChange={set("aoErt")} /></Row>
        <div style={{borderTop:`1px solid ${C.border}`}} />
        <Auto label="= EBT intern" value={ebtIn} />
        <Auto label={`− Neue Steuern (${steuersatz.toFixed(2)}%)`} value={-steuer} warn />
        <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"0.4rem 0.55rem",background:C.green,border:`1px solid ${C.greenb}`,borderRadius:4}}>
          <span style={{fontSize:10,color:"#1c1f2a",fontFamily:T.mono,fontWeight:600}}>= Effektiver Jahresgewinn</span>
          <span style={{fontSize:10,color:C.accent,fontFamily:T.mono,fontWeight:600}}>{fmt(effG)}</span>
        </div>
      </div>
    </div>
  );
}

// ─── JahreTabelle (kompakte tabellarische Ansicht für 1-3 Jahre) ─────────────
function JahreTabelle({ew, setEw, steuersatz, sv}) {
  const yr = new Date().getFullYear();
  const active = [
    {key:"j1", label:yr-1, weight: ew.z3?3:ew.z2?2:1},
    ...(ew.z2 ? [{key:"j2", label:yr-2, weight: ew.z3?2:1}] : []),
    ...(ew.z3 ? [{key:"j3", label:yr-3, weight:1}] : []),
  ];
  const svSrSum = sv ? (
    num(sv.srDelk)+num(sv.srAa)+num(sv.srVor)+num(sv.srForder)
    + Math.max(0, num(sv.avVk)-num(sv.avBw))
    + num(sv.traP)+num(sv.rueck)
  ) : 0;
  const totalW = active.reduce((s,a)=>s+a.weight, 0);
  const compute = d => {
    const ebtEx = num(d.gewinn)+num(d.steuern);
    const srV = num(d.srAkt)-num(d.srVj);
    const lohnB = num(d.lohnAkt)-num(d.lohnMkt);
    const aoN = num(d.aoAuf)-num(d.aoErt);
    const ebtIn = ebtEx+srV+lohnB+aoN;
    const steuer = ebtIn*(steuersatz/100);
    const effG = ebtIn-steuer;
    return {ebtEx, srV, lohnB, aoN, ebtIn, steuer, effG};
  };
  const m = active.map(a => compute(ew[a.key]));
  const gewichteterGewinn = totalW>0 ? m.reduce((s, x, i) => s + x.effG * active[i].weight, 0) / totalW : 0;
  const setField = (yearKey, field) => v => setEw(p => ({...p, [yearKey]: {...p[yearKey], [field]: v}}));
  const cols = `minmax(140px, 0.9fr) repeat(${active.length}, minmax(80px, 1fr))`;
  const grupp = [
    {hd:"Jahresgewinn & Steuern", rows:[
      {label:"Jahresgewinn ER", hint:"Reingewinn laut Erfolgsrechnung dieses Jahres", field:"gewinn", input:true},
      {label:"+ Steuern", hint:"Bezahlte Gewinnsteuern dieser Periode", field:"steuern", input:true},
      {label:"= EBT extern", computed:m.map(x=>x.ebtEx)},
    ]},
    {hd:"Veränderung stille Reserven", rows:[
      {label:"Stille Reserven Vorjahr", hint:"Geschätzter Gesamtbetrag stille Reserven am Anfang der Periode", field:"srVj", input:true},
      {label:"Stille Reserven aktuell", hint:"Geschätzter Gesamtbetrag stille Reserven am Ende der Periode", field:"srAkt", input:true},
      {label:"= Veränderung", computed:m.map(x=>x.srV)},
    ]},
    {hd:"Unternehmerlohnbereinigung", rows:[
      {label:"Aktueller Lohn", hint:"Effektiv bezogener Lohn inkl. Sozialleistungen", field:"lohnAkt", input:true},
      {label:"Marktgerechter Lohn", hint:"Lohn eines externen Geschäftsführers für diese Funktion", field:"lohnMkt", input:true},
      {label:"= Korrektur", computed:m.map(x=>x.lohnB)},
    ]},
    {hd:"Ausserordentliches / Betriebsfremdes", rows:[
      {label:"Einmaliger Aufwand", hint:"z.B. Restrukturierungskosten – wird addiert", field:"aoAuf", input:true},
      {label:"Einmaliger Ertrag", hint:"z.B. Liegenschaftsverkauf – wird subtrahiert", field:"aoErt", input:true},
    ]},
    {hd:"Resultat", rows:[
      {label:"= EBT intern", computed:m.map(x=>x.ebtIn)},
      {label:`− Neue Steuern (${steuersatz.toFixed(1)}%)`, computed:m.map(x=>-x.steuer), neg:true},
      {label:"= Nachhaltiger Gewinn", computed:m.map(x=>x.effG), hl:true},
    ]},
  ];
  return (
    <div>
      <div className="jahre-tabelle" style={{display:"grid", gridTemplateColumns:cols, gap:"0.35rem 0.5rem", alignItems:"center"}}>
        <div></div>
        {active.map((a, i) => (
          <div key={i} style={{position:"relative", textAlign:"center", padding:"0.55rem 0.4rem", background:C.bg, borderRadius:6}}>
            <div style={{fontSize:9, letterSpacing:"0.1em", color:C.dim, fontFamily:T.mono, textTransform:"uppercase"}}>Jahr {i+1}</div>
            <div style={{fontSize:13, color:C.text, fontFamily:T.sans, fontWeight:600}}>{a.label}</div>
            <div style={{fontSize:9, color:C.accent, fontFamily:T.mono}}>Gewicht ×{a.weight}</div>
            {i>0 && (
              <button onClick={()=>{
                if(a.key==="j3") setEw(p=>({...p,z3:false}));
                else if(a.key==="j2") setEw(p=>({...p,z2:false,z3:false}));
              }} title="Jahr entfernen"
                style={{position:"absolute",top:2,right:5,background:"none",border:"none",color:C.dim,cursor:"pointer",fontSize:14,fontFamily:T.mono,lineHeight:1,padding:0}}>×</button>
            )}
          </div>
        ))}
        {grupp.map((grp, gi) => (
          <React.Fragment key={gi}>
            <div style={{gridColumn:"1 / -1", padding:"0.65rem 0 0.25rem 0", fontSize:9.5, letterSpacing:"0.13em", color:C.accent, textTransform:"uppercase", fontFamily:T.mono, borderBottom:`1px solid #e8f5f1`, marginTop: gi===0?"0.5rem":"0.2rem"}}>{grp.hd}</div>
            {grp.rows.map((r, ri) => (
              <React.Fragment key={ri}>
                <div style={{display:"flex", alignItems:"center", padding:"0.3rem 0", fontSize:10.5, color:r.input?C.muted:C.dim, fontFamily:T.mono, lineHeight:1.3, fontWeight:r.hl?600:400}}>
                  <span>{r.label}</span>
                  {r.hint && <InfoTip>{r.hint}</InfoTip>}
                </div>
                {r.input ? active.map((a, i) => {
                  const showSrHint = r.field==="srAkt" && i===0 && svSrSum>0 && String(ew[a.key].srAkt)!==String(svSrSum);
                  return (
                    <div key={i}>
                      <Inp value={ew[a.key][r.field]} onChange={setField(a.key, r.field)} />
                      {showSrHint && (
                        <button onClick={()=>setField(a.key,"srAkt")(String(svSrSum))}
                          style={{marginTop:3,padding:"0.25rem 0.45rem",background:C.green,border:`1px solid ${C.greenb}`,borderRadius:4,color:C.accent,fontSize:9,letterSpacing:"0.03em",fontFamily:T.mono,cursor:"pointer",width:"100%",textAlign:"left",lineHeight:1.3}}>
                          ↓ Aus Substanzwert: {fmt(svSrSum)}
                        </button>
                      )}
                    </div>
                  );
                }) : (r.computed||[]).map((v, i) => (
                  <div key={i} style={{padding:"0.4rem 0.55rem", background:r.hl?C.green:"transparent", border:r.hl?`1px solid ${C.greenb}`:`1px solid ${C.bg}`, borderRadius:4, fontSize:10.5, color:!v?C.dim:r.neg?C.neg:r.hl?C.accent:C.text, fontFamily:T.mono, fontWeight:r.hl?600:500, textAlign:"right"}}>
                    {v===0 || isNaN(v) ? "–" : fmt(v)}
                  </div>
                ))}
              </React.Fragment>
            ))}
          </React.Fragment>
        ))}
      </div>
      <div style={{display:"flex", gap:"0.5rem", marginTop:"0.9rem", flexWrap:"wrap"}}>
        {!ew.z2 && (
          <button onClick={()=>setEw(p=>({...p,z2:true}))}
            style={{padding:"0.55rem 0.9rem", background:"none", border:`1px dashed ${C.border}`, borderRadius:5, color:C.dim, fontSize:10.5, letterSpacing:"0.08em", textTransform:"uppercase", fontFamily:T.mono, cursor:"pointer"}}>
            + Vorjahr ({yr-2}) hinzufügen
          </button>
        )}
        {ew.z2 && !ew.z3 && (
          <button onClick={()=>setEw(p=>({...p,z3:true}))}
            style={{padding:"0.55rem 0.9rem", background:"none", border:`1px dashed ${C.border}`, borderRadius:5, color:C.dim, fontSize:10.5, letterSpacing:"0.08em", textTransform:"uppercase", fontFamily:T.mono, cursor:"pointer"}}>
            + Vorvorjahr ({yr-3}) hinzufügen
          </button>
        )}
      </div>
      {active.length>1 && (
        <div style={{marginTop:"0.9rem", padding:"0.9rem 1.1rem", background:C.green, border:`1px solid ${C.greenb}`, borderRadius:6, display:"flex", justifyContent:"space-between", alignItems:"center"}}>
          <span style={{fontSize:10.5, letterSpacing:"0.1em", color:C.accent, textTransform:"uppercase", fontFamily:T.mono, fontWeight:600}}>Gewichteter Durchschnitt (nachhaltiger Gewinn)</span>
          <span style={{fontSize:"1.15rem", color:C.accent, fontFamily:T.mono, fontWeight:600}}>{fmt(gewichteterGewinn)}</span>
        </div>
      )}
    </div>
  );
}

// ─── SUBSTANZWERT TAB ─────────────────────────────────────────────────────────
function TabSV({steuersatz,sv,setSv}) {
  const set = f => v => setSv(p=>({...p,[f]:v}));
  const srAV             = Math.max(0, num(sv.avVk)-num(sv.avBw));
  const nbSR             = Math.max(0, num(sv.nbVk)-num(sv.nbBw));
  const nbZ              = nbSR * 0.5;
  const uvAbzug          = num(sv.deb)+num(sv.vor)+num(sv.ang)+num(sv.traA);
  const passivenZuschlag = num(sv.traP)+num(sv.rueck);
  const srUV             = num(sv.srDelk)+num(sv.srAa)+num(sv.srVor)+num(sv.srForder);
  const ltPassiven = passivenZuschlag * (steuersatz/100);
  const ltAV       = srAV             * (steuersatz/100);
  const ltUV       = srUV             * (steuersatz/100);
  const lt         = ltPassiven + ltAV + ltUV;
  const result = num(sv.ek)+num(sv.jg) - uvAbzug + passivenZuschlag + srAV + srUV - lt + nbZ - num(sv.div);

  return (
    <div className="responsive-2col" style={{display:"grid",gridTemplateColumns:"1.1fr 0.9fr",gap:"1.8rem",alignItems:"start"}}>
      <div>
        <Sec title="Eigenkapital" accent>
          <Row label="Total Eigenkapital ohne Jahresgewinn" hint="Gemäss Bilanz vor Gewinnverwendung"><Inp value={sv.ek} onChange={set("ek")} /></Row>
          <Row label="Jahresgewinn / -verlust" hint="Gemäss Erfolgsrechnung (negativ = Verlust)"><Inp value={sv.jg} onChange={set("jg")} /></Row>
        </Sec>
        <Sec title="Überbewertete Aktiven" hint="Beträge eingeben, um die einzelne Bilanzpositionen überhöht sind. Diese Abzüge senken den Substanzwert.">
          <div>
            <Row label="Gefährdete Forderungen" hint="Kunden die voraussichtlich nicht zahlen werden – Betrag der uneinbringlichen Forderungen"><Inp value={sv.deb} onChange={set("deb")} positiveOnly /></Row>
            <HerleitungBlock open={sv.debOpen} onToggle={()=>set("debOpen")(!sv.debOpen)}
              formula="Ausfallrisiko = Total Forderungen − Voraussichtlich einbringbar"
              labelA="Total Forderungen in Bilanz" hintA="Saldo Debitorenkonto laut aktueller Bilanz"
              valueA={sv.debA} onChangeA={set("debA")}
              labelB="Davon voraussichtlich einbringbar" hintB="Realistisch zahlende Kunden / werthaltige Forderungen"
              valueB={sv.debB} onChangeB={set("debB")}
              resultLabel="Ausfallrisiko" onApply={set("deb")} />
          </div>
          <div>
            <Row label="Vorräte / Warenlager zu hoch bewertet" hint="Veralteter Lagerbestand, unverkäufliche Waren – Betrag der Wertberichtigung"><Inp value={sv.vor} onChange={set("vor")} positiveOnly /></Row>
            <HerleitungBlock open={sv.vorOpen} onToggle={()=>set("vorOpen")(!sv.vorOpen)}
              formula="Überbewertung = Buchwert in Bilanz − Tatsächlicher Marktwert"
              labelA="Buchwert Warenlager" hintA="Wert des Warenlagers laut aktueller Bilanz"
              valueA={sv.vorA} onChangeA={set("vorA")}
              labelB="Tatsächlicher Marktwert" hintB="Realistischer Veräusserungswert (ohne unverkäufliche Ware)"
              valueB={sv.vorB} onChangeB={set("vorB")}
              resultLabel="Überbewertung" onApply={set("vor")} />
          </div>
          <div>
            <Row label="Angefangene Arbeiten / noch nicht fakturierte Leistungen zu hoch bewertet" hint="Projekte die nicht mehr fertiggestellt oder verrechnet werden können – Betrag der Überhöhung"><Inp value={sv.ang} onChange={set("ang")} positiveOnly /></Row>
            <HerleitungBlock open={sv.angOpen} onToggle={()=>set("angOpen")(!sv.angOpen)}
              formula="Überbewertung = Buchwert − Tatsächlich werthaltig"
              labelA="Buchwert angefangene Arbeiten" hintA="Wert laut aktueller Bilanz (inkl. noch nicht fakturierte Leistungen)"
              valueA={sv.angA} onChangeA={set("angA")}
              labelB="Tatsächlich werthaltig / fakturierbar" hintB="Realistisch noch verrechenbare Projekte"
              valueB={sv.angB} onChangeB={set("angB")}
              resultLabel="Überbewertung" onApply={set("ang")} />
          </div>
          <div>
            <Row label="Transitorische Aktiven zu hoch bewertet" hint="Aktive Rechnungsabgrenzungen die nicht mehr benötigt werden oder bereits verbraucht sind"><Inp value={sv.traA} onChange={set("traA")} positiveOnly /></Row>
            <HerleitungBlock open={sv.traAOpen} onToggle={()=>set("traAOpen")(!sv.traAOpen)}
              formula="Überhöhung = Transitorische Aktiven in Bilanz − Tatsächlich gerechtfertigt"
              labelA="Transitorische Aktiven in Bilanz" hintA="Aktive Rechnungsabgrenzungen laut aktueller Bilanz"
              valueA={sv.traAA} onChangeA={set("traAA")}
              labelB="Davon gerechtfertigt" hintB="Anteil der noch zukünftigen Aufwand abgrenzt"
              valueB={sv.traAB} onChangeB={set("traAB")}
              resultLabel="Überhöhung" onApply={set("traA")} />
          </div>
        </Sec>
        <Sec title="Stille Reserven auf Umlaufvermögen" hint="Wenn Aktiven des Umlaufvermögens zu tief bewertet sind (z.B. überhöhte Wertberichtigungen), wird die stille Reserve aufgelöst und dem Substanzwert zugeschlagen. Latente Steuern werden automatisch berücksichtigt.">
          <div>
            <Row label="Stille Reserve Delkredere" hint="Wenn die Wertberichtigung auf Debitoren höher als nötig ist – Betrag der Überhöhung"><Inp value={sv.srDelk} onChange={set("srDelk")} positiveOnly /></Row>
            <HerleitungBlock open={sv.srDelkOpen} onToggle={()=>set("srDelkOpen")(!sv.srDelkOpen)}
              formula="Stille Reserve = Delkredere in Bilanz − gerechtfertigter Anteil"
              labelA="Delkredere in aktueller Bilanz" hintA="Wertberichtigung auf Debitoren – wie in der aktuellen Bilanz ausgewiesen"
              valueA={sv.srDelkBilanz} onChangeA={set("srDelkBilanz")}
              labelB="Davon gerechtfertigt" hintB="Anteil, der tatsächlich uneinbringliche Forderungen abdeckt"
              valueB={sv.srDelkRecht} onChangeB={set("srDelkRecht")}
              resultLabel="Stille Reserve" onApply={set("srDelk")} />
          </div>
          <div>
            <Row label="Stille Reserve Angefangene Arbeiten" hint="Wenn angefangene Arbeiten zu tief bewertet sind – Differenz zum effektiven Wert"><Inp value={sv.srAa} onChange={set("srAa")} positiveOnly /></Row>
            <HerleitungBlock open={sv.srAaOpen} onToggle={()=>set("srAaOpen")(!sv.srAaOpen)}
              formula="Stille Reserve = Tatsächlich werthaltig − Buchwert in Bilanz"
              labelA="Tatsächlich werthaltig" hintA="Realistischer Wert der angefangenen Arbeiten / noch nicht fakturierten Leistungen"
              valueA={sv.srAaA} onChangeA={set("srAaA")}
              labelB="Buchwert in Bilanz" hintB="Wert laut aktueller Bilanz"
              valueB={sv.srAaB} onChangeB={set("srAaB")}
              resultLabel="Stille Reserve" onApply={set("srAa")} />
          </div>
          <div>
            <Row label="Stille Reserve Vorräte / Warenlager" hint="Wenn Vorräte/Warenlager zu tief bewertet sind (z.B. Warendrittel) – Betrag der Unterbewertung"><Inp value={sv.srVor} onChange={set("srVor")} positiveOnly /></Row>
            <HerleitungBlock open={sv.srVorOpen} onToggle={()=>set("srVorOpen")(!sv.srVorOpen)}
              formula="Stille Reserve = Tatsächlicher Marktwert − Buchwert in Bilanz"
              labelA="Tatsächlicher Marktwert" hintA="Realistischer Veräusserungswert oder Wert ohne steuerliches Warendrittel"
              valueA={sv.srVorA} onChangeA={set("srVorA")}
              labelB="Buchwert in Bilanz" hintB="Wert laut aktueller Bilanz (z.B. nach Warendrittel-Abschlag)"
              valueB={sv.srVorB} onChangeB={set("srVorB")}
              resultLabel="Stille Reserve" onApply={set("srVor")} />
          </div>
          <div>
            <Row label="Stille Reserve Forderungen" hint="Übrige Forderungen die zu tief bewertet sind – Betrag der Unterbewertung"><Inp value={sv.srForder} onChange={set("srForder")} positiveOnly /></Row>
            <HerleitungBlock open={sv.srForderOpen} onToggle={()=>set("srForderOpen")(!sv.srForderOpen)}
              formula="Stille Reserve = Tatsächlicher Wert − Buchwert in Bilanz"
              labelA="Tatsächlicher Wert" hintA="Realistischer Wert der übrigen Forderungen"
              valueA={sv.srForderA} onChangeA={set("srForderA")}
              labelB="Buchwert in Bilanz" hintB="Wert laut aktueller Bilanz"
              valueB={sv.srForderB} onChangeB={set("srForderB")}
              resultLabel="Stille Reserve" onApply={set("srForder")} />
          </div>
          {srUV>0&&<Auto label="→ Stille Reserven UV total" value={srUV} hl />}
        </Sec>
        <Sec title="Stille Reserven auf Anlagevermögen" hint="Differenz zwischen Buchwert und tatsächlichem Verkehrswert von Maschinen, Fahrzeugen, Einrichtungen.">
          <Row label="Buchwert Anlagevermögen" hint="Maschinen, Fahrzeuge, Einrichtungen"><Inp value={sv.avBw} onChange={set("avBw")} /></Row>
          <Row label="Tatsächlicher Verkehrswert" hint="Geschätzter Marktwert / Wiederbeschaffungswert"><Inp value={sv.avVk} onChange={set("avVk")} /></Row>
          {srAV>0&&<Auto label="→ Stille Reserve" value={srAV} />}
        </Sec>
        <Sec title="Nicht betriebsnotwendiges Vermögen" hint="Vermögen das nicht für den operativen Betrieb gebraucht wird – wird mit 50% Pauschale (inkl. latente Steuern) zugeschlagen.">
          <Row label="Buchwert" hint="z.B. Renditeliegenschaften, überschüssige Liquidität"><Inp value={sv.nbBw} onChange={set("nbBw")} /></Row>
          <Row label="Tatsächlicher Verkehrswert"><Inp value={sv.nbVk} onChange={set("nbVk")} /></Row>
          {nbSR>0&&<Auto label={`→ Stille Reserve: ${fmt(nbSR)} × 50% = Zuschlag`} value={nbZ} />}
        </Sec>
        <Sec title="Überbewertete Passiven" hint="Wenn Passiven zu hoch ausgewiesen sind, ist das Unternehmen weniger verschuldet als bilanziert – das erhöht den Substanzwert.">
          <div>
            <Row label="Transitorische Passiven zu hoch" hint="Passive Rechnungsabgrenzungen die aufgelöst werden können – Betrag der Überhöhung"><Inp value={sv.traP} onChange={set("traP")} positiveOnly /></Row>
            <HerleitungBlock open={sv.traPOpen} onToggle={()=>set("traPOpen")(!sv.traPOpen)}
              formula="Überhöhung = Transitorische Passiven in Bilanz − Tatsächlich gerechtfertigt"
              labelA="Transitorische Passiven in Bilanz" hintA="Passive Rechnungsabgrenzungen laut aktueller Bilanz"
              valueA={sv.traPA} onChangeA={set("traPA")}
              labelB="Davon gerechtfertigt" hintB="Anteil der noch zukünftigen Ertrag abgrenzt"
              valueB={sv.traPB} onChangeB={set("traPB")}
              resultLabel="Überhöhung" onApply={set("traP")} />
          </div>
          <div>
            <Row label="Überhöhte Rückstellungen" hint="Rückstellungen für Risiken die nicht mehr bestehen oder deutlich zu hoch angesetzt wurden"><Inp value={sv.rueck} onChange={set("rueck")} positiveOnly /></Row>
            <HerleitungBlock open={sv.rueckOpen} onToggle={()=>set("rueckOpen")(!sv.rueckOpen)}
              formula="Überhöhung = Rückstellung in Bilanz − Tatsächlich notwendig"
              labelA="Rückstellung in aktueller Bilanz" hintA="Höhe der Rückstellung laut aktueller Bilanz"
              valueA={sv.rueckA} onChangeA={set("rueckA")}
              labelB="Tatsächlich notwendig" hintB="Realistisch erwarteter Mittelabfluss für das Risiko"
              valueB={sv.rueckB} onChangeB={set("rueckB")}
              resultLabel="Überhöhung" onApply={set("rueck")} />
          </div>
        </Sec>
        <Sec title="Dividende" color="#c026d3">
          <Row label="Beschlossene Dividende" hint="Bereits traktandiert / beschlossen, noch nicht ausbezahlt"><Inp value={sv.div} onChange={set("div")} /></Row>
        </Sec>
      </div>
      <div className="sticky-calc" style={{position:"sticky",top:"1rem"}}>
        <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:"1.5rem",boxShadow:"0 1px 3px rgba(28,31,42,0.04)"}}>
          <div style={{fontSize:10.5,letterSpacing:"0.18em",color:C.accent,textTransform:"uppercase",marginBottom:"1.1rem",fontFamily:T.mono}}>Berechnung</div>
          {[
            ["Eigenkapital ohne Jahresgewinn", num(sv.ek)],
            ["+ Jahresgewinn / -verlust", num(sv.jg)],
            ["− Überbewertete Debitoren / Vorräte / Transitorische Aktiven", -uvAbzug],
            ["+ Überhöhte Rückstellungen / Transitorische Passiven", passivenZuschlag],
            ["+ Stille Reserven Umlaufvermögen", srUV],
            ["+ Stille Reserven Anlagevermögen", srAV],
            ["+ Nicht betriebsnotwendiges Anlagevermögen (50% stille Reserve)", nbZ],
            ["− Latente Steuern auf Passiven-Korrekturen", -ltPassiven],
            ["− Latente Steuern auf UV", -ltUV],
            ["− Latente Steuern auf AV betrieblich", -ltAV],
            ["− Beschlossene Dividende", -num(sv.div)],
          ].map(([l,v],i)=>(
            <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"0.28rem 0",borderBottom:`1px solid ${C.bg}`}}>
              <span style={{fontSize:10,color:C.muted,fontFamily:T.mono}}>{l}</span>
              <span style={{fontSize:10,color:v<0?C.neg:v===0?"#dcdfe6":C.text,fontFamily:T.mono}}>{v===0?"–":fmt(v)}</span>
            </div>
          ))}
          {steuersatz===0&&(
            <div style={{padding:"0.5rem 0.6rem",background:"#fef9f0",border:"1px solid #e8c890",borderRadius:4,marginBottom:"0.5rem",fontSize:11,color:"#7a5520",fontFamily:T.mono}}>
              ⚠ Kanton wählen für latente Steuern
            </div>
          )}
          <div style={{marginTop:"1.1rem",display:"flex",justifyContent:"space-between",alignItems:"center",padding:"0.7rem",background:C.green,border:`1px solid ${C.greenb}`,borderRadius:6}}>
            <span style={{fontSize:11,color:"#1c1f2a",fontFamily:T.mono,fontWeight:600}}>Substanzwert (netto)</span>
            <span style={{fontSize:"1.2rem",color:C.accent,fontFamily:T.mono,fontWeight:600}}>{fmt(result)}</span>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── ERTRAGSWERT TAB ──────────────────────────────────────────────────────────
function TabEW({steuersatz,ew,setEw,sv}) {
  const set = f => v => setEw(p=>({...p,[f]:v}));
  const bObj  = BRANCHEN_EW.find(b=>b.v===ew.branche);
  const zBas  = bObj?.z??12;
  const zVors = clamp(zBas+RISIKO_DELTA[ew.risiko],8,18);
  const zEff  = ew.zOvr!==""?num(ew.zOvr):zVors;
  const zbSum = num(ew.zbBasis)+num(ew.zbGroesse)+num(ew.zbFluk)+num(ew.zbVerk)+num(ew.zbWett)+num(ew.zbRecht);
  const zbPlausibel = zbSum>=10&&zbSum<=15;

  const calcJ = d => {
    const ebtEx = num(d.gewinn)+num(d.steuern);
    const srV   = num(d.srAkt)-num(d.srVj);
    const lB    = num(d.lohnAkt)-num(d.lohnMkt);
    const aoN   = num(d.aoAuf)-num(d.aoErt);
    const ebtIn = ebtEx+srV+lB+aoN;
    return ebtIn-ebtIn*(steuersatz/100);
  };
  const g1=calcJ(ew.j1), g2=ew.z2?calcJ(ew.j2):null, g3=ew.z3?calcJ(ew.j3):null;
  const gD = !ew.z2?g1:!ew.z3?(g1*2+g2)/3:(g1*3+g2*2+g3)/6;
  const result = zEff>0?(gD/(zEff/100)):0;
  const yr = new Date().getFullYear();

  return (
    <div className="responsive-2col" style={{display:"grid",gridTemplateColumns:"1.15fr 0.85fr",gap:"1.8rem",alignItems:"start"}}>
      <div>
        <Sec title="Branche & Kapitalisierungszinssatz" accent>
          <Row label="Branche"><Sel value={ew.branche} onChange={v=>setEw(p=>({...p,branche:v,zOvr:""}))} options={BRANCHEN_EW.map(b=>({v:b.v,l:b.l}))} placeholder="Branche wählen…" /></Row>
          <Row label="Risikoeinschätzung" hint="Beeinflusst den Kapitalisierungszinssatz">
            <div style={{display:"flex",gap:"0.45rem"}}>
              {["tief","mittel","hoch"].map(r=>(
                <button key={r} onClick={()=>setEw(p=>({...p,risiko:r,zOvr:""}))}
                  style={{flex:1,padding:"0.55rem 0",border:`1px solid ${ew.risiko===r?C.accent:C.border}`,borderRadius:5,cursor:"pointer",background:ew.risiko===r?C.green:C.card,color:ew.risiko===r?C.accent:C.dim,fontSize:10,letterSpacing:"0.08em",textTransform:"uppercase",fontFamily:T.mono}}>
                  {r==="tief"?"Tief":r==="mittel"?"Mittel":"Hoch"}
                  <div style={{fontSize:10,marginTop:2,color:ew.risiko===r?C.accent:"#b0b3bc"}}>{r==="tief"?"−1.5%":r==="mittel"?"±0%":"+1.5%"}</div>
                </button>
              ))}
            </div>
          </Row>
          {ew.branche&&<div style={{background:C.bg,borderRadius:5,padding:"0.55rem 0.7rem",fontSize:11,color:C.dim,fontFamily:T.mono,lineHeight:1.7}}>
            Branchenbasis: {zBas.toFixed(1)}% · Risiko: {RISIKO_DELTA[ew.risiko]>=0?"+":""}{RISIKO_DELTA[ew.risiko].toFixed(1)}% → <span style={{color:C.accent,fontWeight:600}}>Vorschlag: {zVors.toFixed(1)}%</span>
          </div>}
          <Row label="Kapitalisierungszinssatz" hint="Manuell überschreibbar">
            <div style={{display:"flex",flexDirection:"column",gap:"0.45rem"}}>
              <input type="range" min="8" max="18" step="0.5" value={zEff} onChange={e=>set("zOvr")(e.target.value)} style={{width:"100%"}} />

            </div>

          <div style={{marginTop:"0.4rem"}}>

                <Row label="+ Erschwerte Verkäuflichkeit" hint="Nicht börsenkotiert, illiquide Beteiligung. Typisch 1–3%."><Inp value={ew.zbVerk} onChange={set("zbVerk")} prefix="%" placeholder="2.5" /></Row>
                <Row label="+ Wettbewerb / Markt" hint="Druck durch ausländische Anbieter, Margen-Erosion, Substitutionsrisiko. Typisch 1–2%."><Inp value={ew.zbWett} onChange={set("zbWett")} prefix="%" placeholder="1.5" /></Row>

                    <div style={{fontSize:10.5,letterSpacing:"0.1em",textTransform:"uppercase",color:C.muted,fontFamily:T.mono}}>= Kapitalisierungszinssatz</div>

                  </div>

        </Sec>
        <Sec title="Jahresgewinne & Bereinigungen" hint="Alle Eingaben pro Jahr in einer kompakten Tabelle. 1 Jahr reicht für eine Schätzung, 2–3 Jahre erhöhen die Aussagekraft (Gewichtung 3:2:1).">
          {(()=>{
            const yr = new Date().getFullYear();
            const svvjUV = num(ew.svvjSrDelk)+num(ew.svvjSrAa)+num(ew.svvjSrVor)+num(ew.svvjSrForder);

                  <span>{ew.svvjOpen?"▾":"▸"} Herleitung stille Reserven Vorjahr (optional)</span>
                  {svvjTotal>0&&<span style={{fontFamily:T.mono,color:A,fontWeight:600}}>{fmt(svvjTotal)}</span>}
                </button>
                {ew.svvjOpen&&(

                    <div style={{fontSize:11,color:A,fontFamily:T.mono,lineHeight:1.6,padding:"0.4rem 0.6rem",background:"#fef3d8",borderRadius:4,fontWeight:600}}>
                      ⓘ Diese Eingaben gelten für den Anfangsbestand stille Reserven – Stand <strong>per 31.12.{yr-2}</strong> (= Ende Vorjahr = Anfang Jahr 1)
                    </div>
                    <div>
                      <div style={{fontSize:10,letterSpacing:"0.12em",color:A,textTransform:"uppercase",fontFamily:T.mono,marginBottom:"0.5rem",paddingBottom:"0.25rem",borderBottom:`1px solid ${AB}`}}>Stille Reserven auf Umlaufvermögen (Vorjahr)</div>
                      <div style={{display:"flex",flexDirection:"column",gap:"0.55rem"}}>
                        <Row label="Stille Reserve Delkredere"><Inp value={ew.svvjSrDelk} onChange={set("svvjSrDelk")} positiveOnly /></Row>
                        <Row label="Stille Reserve Angefangene Arbeiten"><Inp value={ew.svvjSrAa} onChange={set("svvjSrAa")} positiveOnly /></Row>
                        <Row label="Stille Reserve Vorräte / Warenlager"><Inp value={ew.svvjSrVor} onChange={set("svvjSrVor")} positiveOnly /></Row>
                        <Row label="Stille Reserve Forderungen"><Inp value={ew.svvjSrForder} onChange={set("svvjSrForder")} positiveOnly /></Row>
                        {svvjUV>0&&<Auto label="→ Total UV" value={svvjUV} />}
                      </div>
                    </div>
                    <div>
                      <div style={{fontSize:10,letterSpacing:"0.12em",color:A,textTransform:"uppercase",fontFamily:T.mono,marginBottom:"0.5rem",paddingBottom:"0.25rem",borderBottom:`1px solid ${AB}`}}>Stille Reserven auf Anlagevermögen (Vorjahr)</div>
                      <div style={{display:"flex",flexDirection:"column",gap:"0.55rem"}}>
                        <Row label="Buchwert Anlagevermögen Vorjahr"><Inp value={ew.svvjAvBw} onChange={set("svvjAvBw")} positiveOnly /></Row>
                        <Row label="Tatsächlicher Verkehrswert Vorjahr"><Inp value={ew.svvjAvVk} onChange={set("svvjAvVk")} positiveOnly /></Row>
                        {svvjAV>0&&<Auto label="→ Stille Reserve AV" value={svvjAV} />}
                      </div>
                    </div>
                    <div>
                      <div style={{fontSize:10,letterSpacing:"0.12em",color:A,textTransform:"uppercase",fontFamily:T.mono,marginBottom:"0.5rem",paddingBottom:"0.25rem",borderBottom:`1px solid ${AB}`}}>Überbewertete Passiven (Vorjahr)</div>
                      <div style={{display:"flex",flexDirection:"column",gap:"0.55rem"}}>
                        <Row label="Transitorische Passiven zu hoch"><Inp value={ew.svvjTraP} onChange={set("svvjTraP")} positiveOnly /></Row>
                        <Row label="Überhöhte Rückstellungen"><Inp value={ew.svvjRueck} onChange={set("svvjRueck")} positiveOnly /></Row>
                        {svvjPass>0&&<Auto label="→ Total Passiven" value={svvjPass} />}
                      </div>
                    </div>
                    <div style={{display:"flex",justifyContent:"space-between",alignItems:"center",padding:"0.7rem 0.9rem",background:"#fef3d8",border:`1px solid ${AB}`,borderRadius:6}}>
                      <span style={{fontSize:10.5,letterSpacing:"0.1em",color:A,textTransform:"uppercase",fontFamily:T.mono,fontWeight:600}}>= Total stille Reserven Vorjahr</span>
                      <span style={{fontSize:"1.1rem",color:A,fontFamily:T.mono,fontWeight:600}}>{svvjTotal>0?fmt(svvjTotal):"–"}</span>
                    </div>
                    {svvjTotal>0&&<button onClick={()=>{setEw(p=>({...p,j1:{...p.j1,srVj:String(svvjTotal)},svvjOpen:false}));}}
                      style={{padding:"0.65rem 0.9rem",background:A,border:"none",borderRadius:5,color:"#fff",fontSize:11,letterSpacing:"0.08em",textTransform:"uppercase",fontFamily:T.mono,fontWeight:600,cursor:"pointer"}}>
                      → Als "Stille Reserven Vorjahr" (Jahr 1) übernehmen
                    </button>}
                  </div>
                )}
              </div>
            );
          })()}
          <JahreTabelle ew={ew} setEw={setEw} steuersatz={steuersatz} sv={sv} />
        </Sec>
      </div>
      <div className="sticky-calc" style={{position:"sticky",top:"1rem"}}>
        <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:"1.5rem",boxShadow:"0 1px 3px rgba(28,31,42,0.04)"}}>

}

// ─── MULTIPLE TAB ─────────────────────────────────────────────────────────────
function TabMU({mu,setMu}) {
  const set = f => v => setMu(p=>({...p,[f]:v}));
  const mVors = MULTIPLES_CH[mu.branche]?.[mu.maKl]??null;
  const mEff  = mu.mOvr!==""?num(mu.mOvr):(mVors??0);
  const g=num(mu.gew), s=num(mu.st), z=num(mu.zi);
  const ae=num(mu.aoA), ee=num(mu.aoE);
  const lB=num(mu.lA)-num(mu.lM);
  const srV=num(mu.srA)-num(mu.srVj);
  const hatL=mu.lA!==""||mu.lM!=="";
  const hatSR=mu.srVj!==""||mu.srA!=="";
  const lLbl=lB>0?"= Lohn überhöht → addiert":lB<0?"= Lohn zu tief → subtrahiert":"= Lohn marktgerecht";
  const srLbl=srV>=0?"= Zunahme stille Reserven":"= Abnahme stille Reserven";
  const ebit=g+s, ebitZ=ebit+z, ebitc=ebitZ+ae-ee+lB+srV;
  const result=ebitc>0&&mEff>0?ebitc*mEff:0;
  const bereit=ebitc!==0&&mEff>0;

  return (
    <div className="responsive-2col" style={{display:"grid",gridTemplateColumns:"1.15fr 0.85fr",gap:"1.8rem",alignItems:"start"}}>
      <div>
        <Sec title="Unternehmen" accent>
          <Row label="Branche"><Sel value={mu.branche} onChange={v=>setMu(p=>({...p,branche:v,mOvr:""}))} options={BRANCHEN_MU} placeholder="Branche wählen…" /></Row>
          <Row label="Anzahl Mitarbeitende (VZÄ)" hint="Vollzeitäquivalente inkl. Inhaber"><Sel value={mu.maKl} onChange={v=>setMu(p=>({...p,maKl:v,mOvr:""}))} options={MA_KLASSEN} placeholder="Grösse wählen…" /></Row>
        </Sec>
        <Sec title="EBITC – Herleitung" accent>
          <Row label="Jahresgewinn gemäss Erfolgsrechnung"><Inp value={mu.gew} onChange={set("gew")} /></Row>
          <Row label="+ Steuern" hint="Bezahlte Gewinnsteuern der Periode"><Inp value={mu.st} onChange={set("st")} /></Row>
          <Auto label="= EBIT (nach Steuern)" value={ebit} />
          <Div/>
          <Row label="+ Zinsaufwand" hint="Finanzaufwand / Schuldzinsen aus Erfolgsrechnung"><Inp value={mu.zi} onChange={set("zi")} /></Row>
          <Auto label="= EBIT (vor Zinsen & Steuern)" value={ebitZ} />
          <Div/>
          <SubH>Korrekturen (C = Corrections)</SubH>
          <Row label="+ Einmaliger Aufwand" hint="z.B. Restrukturierung, Sonderabschreibung"><Inp value={mu.aoA} onChange={set("aoA")} /></Row>
          <Row label="− Einmaliger Ertrag" hint="z.B. Liegenschaftsverkauf, Subventionen"><Inp value={mu.aoE} onChange={set("aoE")} /></Row>
          <Div/>
          <SubH>+/− Unternehmerlohnbereinigung</SubH>
          <Row label="Aktueller Unternehmerlohn" hint="Effektiv bezogener Lohn inkl. Sozialleistungen"><Inp value={mu.lA} onChange={set("lA")} /></Row>
          <Row label="Marktgerechter Lohn" hint="Lohn eines externen Geschäftsführers für diese Funktion"><Inp value={mu.lM} onChange={set("lM")} /></Row>
          {hatL&&<Auto label={lLbl} value={lB} />}
          <Div/>
          <SubH>+/− Veränderung stille Reserven</SubH>
          <Row label="Stille Reserven Vorjahr" hint="Geschätzter Gesamtbetrag"><Inp value={mu.srVj} onChange={set("srVj")} /></Row>
          <Row label="Stille Reserven aktuelles Jahr"><Inp value={mu.srA} onChange={set("srA")} /></Row>
          {hatSR&&<Auto label={srLbl} value={srV} />}
          <div style={{borderTop:`1px solid ${C.border}`}} />
          <Auto label="= EBITC (bereinigter EBIT vor Zinsen & Steuern)" value={ebitc} hl />
        </Sec>
        <Sec title="Branchenmultiple (EBITC)" accent>
          {mu.branche&&mu.maKl?(
            <div style={{background:C.bg,borderRadius:5,padding:"0.65rem 0.85rem",fontSize:11,color:C.dim,fontFamily:T.mono,lineHeight:1.8}}>
              {BRANCHEN_MU.find(b=>b.v===mu.branche)?.l} · {MA_KLASSEN.find(m=>m.v===mu.maKl)?.l}
              <br/><span style={{color:C.accent,fontWeight:600,fontSize:"0.95rem"}}>Multiple: {mVors?.toFixed(1)}×</span>
              <span style={{color:"#b0b3bc"}}> · CH · März 2026 · NIMBO</span>
            </div>
          ):(
            <div style={{background:C.bg,borderRadius:5,padding:"0.65rem 0.85rem",fontSize:11,color:"#b0b3bc",fontFamily:T.mono}}>Branche und Mitarbeiterklasse wählen…</div>
          )}
          <Row label="Multiple (manuell überschreibbar)">
            <div style={{display:"flex",alignItems:"center",background:C.card,border:`1px solid ${C.border}`,borderRadius:5,overflow:"hidden"}}>
              <input type="text" inputMode="decimal" value={mu.mOvr!==""?mu.mOvr:(mEff>0?mEff.toFixed(1):"")} onChange={e=>set("mOvr")(e.target.value.replace(/,/g,".").replace(/[^0-9.]/g,"").replace(/(\..*)\./g,"$1"))} placeholder={mVors?mVors.toFixed(1):"–"}
                style={{flex:1,padding:"0.6rem 0.7rem",background:"transparent",border:"none",outline:"none",color:C.accent,fontSize:15,fontWeight:600,fontFamily:T.mono}} />
              <span style={{padding:"0 0.7rem",color:C.accent,fontFamily:T.mono,fontWeight:600}}>×</span>
            </div>
          </Row>
          {mu.mOvr!==""&&mVors&&<button onClick={()=>set("mOvr")("")} style={{fontSize:11,color:C.dim,background:"none",border:"none",cursor:"pointer",fontFamily:T.mono,padding:0}}>↩ Zurück zu Vorschlag ({mVors.toFixed(1)}×)</button>}
        </Sec>
      </div>
      <div className="sticky-calc" style={{position:"sticky",top:"1rem"}}>
        <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:"1.5rem",boxShadow:"0 1px 3px rgba(28,31,42,0.04)"}}>
          <div style={{fontSize:10.5,letterSpacing:"0.18em",color:C.accent,textTransform:"uppercase",marginBottom:"1.1rem",fontFamily:T.mono}}>Berechnung</div>
          <div style={{fontSize:10.5,color:C.dim,textTransform:"uppercase",letterSpacing:"0.09em",marginBottom:"0.35rem",fontFamily:T.mono}}>EBITC-Herleitung</div>
          {[["Jahresgewinn",g],["+Steuern",s],["+Zinsaufwand",z],["+Einmaliger Aufwand",ae],["−Einmaliger Ertrag",-ee],["+/− Unternehmerlohn",lB],["+/− Stille Reserven",srV]].map(([l,v],i)=>(
            <div key={i} style={{display:"flex",justifyContent:"space-between",padding:"0.22rem 0",borderBottom:`1px solid ${C.bg}`}}>
              <span style={{fontSize:11,color:C.dim,fontFamily:T.mono}}>{l}</span>
              <span style={{fontSize:11,color:v===0?"#dcdfe6":v<0?C.neg:C.muted,fontFamily:T.mono}}>{v===0?"–":fmt(v)}</span>
            </div>
          ))}
          <div style={{display:"flex",justifyContent:"space-between",padding:"0.35rem 0.5rem",background:C.bg,borderRadius:4,margin:"0.5rem 0"}}>
            <span style={{fontSize:11,color:C.muted,fontFamily:T.mono,fontWeight:600}}>= EBITC</span>
            <span style={{fontSize:11,color:C.text,fontFamily:T.mono,fontWeight:600}}>{fmt(ebitc)}</span>
          </div>
          <div style={{display:"flex",justifyContent:"space-between",padding:"0.28rem 0",borderBottom:`1px solid ${C.bg}`}}>
            <span style={{fontSize:10,color:C.muted,fontFamily:T.mono}}>× Multiple (EBITC)</span>
            <span style={{fontSize:10,color:C.text,fontFamily:T.mono}}>{mEff>0?`${mEff.toFixed(1)}×`:"–"}</span>
          </div>
          <div style={{marginTop:"1.1rem",display:"flex",justifyContent:"space-between",alignItems:"center",padding:"0.7rem",background:bereit?C.green:"#eef0f4",border:`1px solid ${bereit?C.greenb:C.bg}`,borderRadius:6}}>
            <span style={{fontSize:11,color:bereit?"#1c1f2a":"#b0b3bc",fontFamily:T.mono,fontWeight:600}}>Unternehmenswert</span>
            <span style={{fontSize:"1.2rem",color:bereit?C.accent:"#dcdfe6",fontFamily:T.mono,fontWeight:600}}>{bereit?fmt(result):"–"}</span>
          </div>
        </div>
      </div>
    </div>
  );
}

// ─── ERGEBNIS PANEL ───────────────────────────────────────────────────────────
function ErgebnisPanel({sv,ew,mu}) {
  const praktiker=(sv&&ew)?(2*ew+sv)/3:null;
  const werte=[
    {l:"1. Substanzwert",v:sv,col:"#6b8a7a"},
    {l:"2. Ertragswert",v:ew,col:"#1e6f63"},
    {l:"3. Praktiker",v:praktiker,col:"#8a7530",formel:true},
    {l:"4. Multiple",v:mu,col:"#7a8a9d"},
  ];
  const verf=werte.filter(w=>w.v&&w.v>0);
  const maxV=Math.max(...verf.map(w=>w.v),1);
  const minV=verf.length>0?Math.min(...verf.map(w=>w.v)):0;
  const hatBandbreite=verf.length>=2;
  const mitte=hatBandbreite?(minV+maxV)/2:null;

  return (
    <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:10,padding:"1.8rem",marginTop:"2.5rem",boxShadow:"0 1px 3px rgba(28,31,42,0.04)"}}>
      <div style={{marginBottom:"1.3rem"}}>
        <div style={{fontSize:10.5,letterSpacing:"0.18em",color:C.accent,textTransform:"uppercase",fontFamily:T.mono,marginBottom:"0.2rem"}}>Ergebnisübersicht</div>
        <div style={{fontSize:10,color:C.dim,fontFamily:T.mono}}>Alle Methoden im Vergleich · Praktiker wird automatisch berechnet</div>
      </div>

      {/* Karten */}
      <div className="responsive-4col" style={{display:"grid",gridTemplateColumns:"repeat(4,1fr)",gap:"0.8rem",marginBottom:"1.5rem"}}>
        {werte.map((w,i)=>{
          const hat=w.v&&w.v>0;
          const bar=hat?(w.v/maxV)*100:0;
          return (
            <div key={i} style={{background:C.bg,borderRadius:6,padding:"0.9rem",border:`1px solid ${hat?C.border:C.bg}`}}>
              <div style={{fontSize:10,letterSpacing:"0.1em",color:hat?w.col:C.border,textTransform:"uppercase",fontFamily:T.mono,marginBottom:"0.45rem"}}>
                {w.l}
                {w.formel&&<div style={{fontSize:10.5,color:"#b0b3bc",marginTop:2}}>(2× EW + SW) ÷ 3</div>}
              </div>
              <div style={{fontSize:"1rem",color:hat?w.col:C.border,fontFamily:T.mono,fontWeight:600,marginBottom:"0.55rem"}}>{hat?fmt(w.v):"–"}</div>
              <div style={{height:3,background:C.card,borderRadius:2,overflow:"hidden"}}>
                <div style={{height:"100%",width:`${bar}%`,background:hat?w.col:"transparent",borderRadius:2,transition:"width 0.4s ease"}} />
              </div>
            </div>
          );
        })}
      </div>

      {/* Bandbreite prominent */}
      {hatBandbreite&&(
        <div style={{background:"#f4f5f8",border:"1px solid #9ad0c2",borderRadius:8,padding:"1.3rem",marginBottom:"1rem"}}>
          <div style={{fontSize:10.5,letterSpacing:"0.18em",color:"#8a7530",textTransform:"uppercase",fontFamily:T.mono,marginBottom:"1rem"}}>
            Verhandlungsbandbreite
          </div>
          {/* Min–Max Balken */}
          <div style={{position:"relative",height:28,marginBottom:"0.6rem"}}>
            <div style={{position:"absolute",inset:0,background:"#e8f5f1",borderRadius:14}} />
            {verf.map((w,i)=>{
              const pct=((w.v-minV)/(maxV-minV||1))*80+10;
              return (
                <div key={i} title={w.l} style={{position:"absolute",top:"50%",left:`${pct}%`,transform:"translate(-50%,-50%)",width:10,height:10,borderRadius:"50%",background:w.col,border:"2px solid #f4f5f8",zIndex:2,cursor:"default"}} />
              );
            })}
            {/* Min label */}
            <div style={{position:"absolute",left:"10%",top:"50%",transform:"translateY(-50%)",width:2,height:18,background:"#9ad0c2",borderRadius:1}} />
            {/* Max label */}
            <div style={{position:"absolute",left:"90%",top:"50%",transform:"translateY(-50%)",width:2,height:18,background:"#9ad0c2",borderRadius:1}} />
          </div>
          {/* Min / Mitte / Max */}
          <div className="responsive-3col" style={{display:"grid",gridTemplateColumns:"1fr 1fr 1fr",gap:"0.5rem",marginBottom:"1rem"}}>
            <div style={{background:"#ffffff",borderRadius:6,padding:"0.75rem",border:"1px solid #c8d4cf"}}>
              <div style={{fontSize:10,color:"#4a6a5a",fontFamily:T.mono,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:4}}>Minimum</div>
              <div style={{fontSize:"1.1rem",color:"#6b8a7a",fontFamily:T.mono,fontWeight:600}}>{fmt(minV)}</div>
              <div style={{fontSize:10,color:"#5a6a5a",fontFamily:T.mono,marginTop:2}}>{werte.find(w=>w.v===minV)?.l||""}</div>
            </div>
            <div style={{background:"#e8f5f1",borderRadius:6,padding:"0.75rem",border:"1px solid #9ad0c2",textAlign:"center"}}>
              <div style={{fontSize:10,color:C.accent,fontFamily:T.mono,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:4}}>Orientierungswert</div>
              <div style={{fontSize:"1.1rem",color:C.accent,fontFamily:T.mono,fontWeight:600}}>{fmt(mitte)}</div>
              <div style={{fontSize:10,color:"#2a6a60",fontFamily:T.mono,marginTop:2}}>Ø aller Methoden</div>
            </div>
            <div style={{background:"#ffffff",borderRadius:6,padding:"0.75rem",border:"1px solid #c8d4cf",textAlign:"right"}}>
              <div style={{fontSize:10,color:"#4a6a5a",fontFamily:T.mono,textTransform:"uppercase",letterSpacing:"0.1em",marginBottom:4}}>Maximum</div>
              <div style={{fontSize:"1.1rem",color:"#8a7530",fontFamily:T.mono,fontWeight:600}}>{fmt(maxV)}</div>
              <div style={{fontSize:10,color:"#5a6a5a",fontFamily:T.mono,marginTop:2}}>{werte.find(w=>w.v===maxV)?.l||""}</div>
            </div>
          </div>
          {/* Bandbreiten-Grafik */}
          <div style={{display:"flex",flexDirection:"column",gap:"0.5rem"}}>
            {verf.map((w,i)=>{
              const pct=Math.max(6,(w.v/maxV)*100);
              return (
                <div key={i} className="bandbreite-row" style={{display:"flex",alignItems:"center",gap:"0.8rem"}}>
                  <div className="bandbreite-label" style={{width:130,fontSize:10.5,color:C.muted,fontFamily:T.mono,textAlign:"right",flexShrink:0}}>{w.l}</div>
                  <div style={{flex:1,height:14,background:"#ffffff",borderRadius:3,overflow:"hidden"}}>
                    <div style={{height:"100%",width:`${pct}%`,background:w.col,borderRadius:3,opacity:0.8,transition:"width 0.4s"}} />
                  </div>
                  <div className="bandbreite-value" style={{width:110,fontSize:10.5,color:w.col,fontFamily:T.mono,fontWeight:600,flexShrink:0}}>{fmt(w.v)}</div>
                </div>
              );
            })}
          </div>
        </div>
      )}

      {/* Disclaimer prominent */}
      <div style={{background:"#fdf8e8",border:"1px solid #e8d090",borderRadius:6,padding:"1rem",marginTop:"0.5rem"}}>
        <div style={{fontSize:10.5,letterSpacing:"0.15em",color:"#7a6520",textTransform:"uppercase",fontFamily:T.mono,marginBottom:"0.5rem"}}>Wichtiger Hinweis</div>
        <div style={{fontSize:10,color:"#6a5520",fontFamily:T.mono,lineHeight:1.9}}>
          Diese Berechnung ist <strong style={{color:"#6a5520"}}>keine Bewertung im rechtlichen Sinne</strong>, sondern eine vereinfachte Wertindikation zur Orientierung. Die Bandbreite spiegelt die methodisch begründeten Unterschiede wider und eignet sich als <strong style={{color:"#6a5520"}}>Verhandlungsgrundlage</strong> — nicht als verbindlicher Unternehmenswert. Für rechtlich belastbare Bewertungen empfehlen wir einen Treuhänder oder zugelassenen Bewertungsspezialisten beizuziehen.
        </div>
      </div>
    </div>
  );
}

// ─── AI IMPORT MODAL ──────────────────────────────────────────────────────────
function AiImportModal({onClose, onImport}) {
  const [phase, setPhase] = useState("upload");   // upload | parsing | interview | done
  const [files, setFiles] = useState([]);
  const [parsing, setParsing] = useState(false);
  const [extracted, setExtracted] = useState(null);
  const [chatHistory, setChatHistory] = useState([]);
  const [userInput, setUserInput] = useState("");
  const [chatLoading, setChatLoading] = useState(false);
  const [interviewData, setInterviewData] = useState({});
  const chatRef = React.useRef(null);

  React.useEffect(() => {
    if(chatRef.current) chatRef.current.scrollTop = chatRef.current.scrollHeight;
  }, [chatHistory]);

  const handleFiles = e => {
    const f = Array.from(e.target.files).filter(f=>f.type==="application/pdf").slice(0,3);
    setFiles(f);
  };

  const toBase64 = file => new Promise((res,rej)=>{
    const r=new FileReader();
    r.onload=()=>res(r.result.split(",")[1]);
    r.onerror=rej;
    r.readAsDataURL(file);
  });

  const handleParse = async () => {
    if(!files.length) return;
    setParsing(true);
    setPhase("parsing");
    try {
      const docs = await Promise.all(files.map(async f => ({
        type:"document",
        source:{type:"base64",media_type:"application/pdf",data:await toBase64(f)}
      })));

      const res = await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          model:"claude-sonnet-4-6",
          max_tokens:1000,
          system:`Du bist ein Schweizer Treuhänder-Assistent. Lies die hochgeladenen Jahresrechnungen und extrahiere die relevanten Kennzahlen für eine KMU-Bewertung nach Schweizer Methoden.

Antworte NUR mit einem JSON-Objekt, ohne Markdown-Backticks, ohne Erklärungen. Format:
{
  "rechtsform": "GmbH|AG|Einzelfirma|andere",
  "kanton": "ZH",
  "jahre": [
    {
      "jahr": 2024,
      "jahresgewinn": 85000,
      "steuern": 18000,
      "zinsaufwand": 5500,
      "eigenkapitalOhneGewinn": 310000
    }
  ],
  "bilanz": {
    "debitoren": 45000,
    "vorraete": 12000,
    "anlagevermoegenBuchwert": 95000,
    "rueckstellungen": 8000
  },
  "unternehmerlohn": 120000,
  "mitarbeitende": "6-25",
  "branche": "it|prod|dl|gastro|handel|bau|andere"
}
Felder die du nicht findest als null. Beträge immer als Zahl ohne CHF.`,
          messages:[{role:"user",content:[...docs,{type:"text",text:"Bitte extrahiere alle relevanten Kennzahlen aus diesen Jahresrechnungen."}]}]
        })
      });
      const data = await res.json();
      const txt = data.content.find(b=>b.type==="text")?.text||"{}";
      const parsed = JSON.parse(txt.replace(/```json|```/g,"").trim());
      setExtracted(parsed);

      // Interview starten
      const firstMsg = await startInterview(parsed);
      setChatHistory([{role:"assistant",content:firstMsg}]);
      setPhase("interview");
    } catch(e) {
      console.error(e);
      setChatHistory([{role:"assistant",content:"Es gab ein Problem beim Einlesen. Bitte prüfe ob die PDFs korrekte Jahresrechnungen sind und versuche es erneut."}]);
      setPhase("interview");
    }
    setParsing(false);
  };

  const startInterview = async (extracted) => {
    const res = await fetch("https://api.anthropic.com/v1/messages",{
      method:"POST",
      headers:{"Content-Type":"application/json"},
      body:JSON.stringify({
        model:"claude-sonnet-4-20250514",
        max_tokens:1000,
        system:`Du bist ein freundlicher Schweizer Treuhänder-Assistent. Du hast gerade die Jahresrechnungen eines KMU eingelesen und stellst nun gezielte Fragen um die Bewertung zu vervollständigen.

Stelle EINE Frage auf einmal. Fragen-Reihenfolge:
1. Stille Reserven: Gibt es Differenzen zwischen Buchwert und Marktwert bei Fahrzeugen, Maschinen, Lager oder Liegenschaften?
2. Unternehmerlohn: Ist der Lohn des Inhabers marktgerecht? Was wäre ein fairer Lohn für einen externen Geschäftsführer?
3. Ausserordentliche Positionen: Gab es einmalige Aufwände oder Erträge (Verkauf von Assets, Restrukturierung, Subventionen)?

Nach 3 Fragen sagst du: "Danke – ich habe alle Informationen. Die Felder werden jetzt ausgefüllt." und gibst dann ein JSON zurück mit:
{"complete":true,"stilleReservenVorjahr":0,"stilleReservenAktuell":0,"lohnAktuell":0,"lohnMarktgerecht":0,"aoAufwand":0,"aoErtrag":0}

Extrahierte Daten: ${JSON.stringify(extracted)}`,
          messages:[{role:"user",content:"Starte das Interview."}]
        })
      });
    const data = await res.json();
    return data.content.find(b=>b.type==="text")?.text||"Guten Tag! Ich habe Ihre Jahresrechnung eingelesen. Lassen Sie mich noch ein paar Fragen stellen.";
  };

  const sendMessage = async () => {
    if(!userInput.trim()||chatLoading) return;
    const msg = userInput.trim();
    setUserInput("");
    const newHistory = [...chatHistory,{role:"user",content:msg}];
    setChatHistory(newHistory);
    setChatLoading(true);

    try {
      const res = await fetch("https://api.anthropic.com/v1/messages",{
        method:"POST",
        headers:{"Content-Type":"application/json"},
        body:JSON.stringify({
          model:"claude-sonnet-4-6",
          max_tokens:1000,
          system:`Du bist ein freundlicher Schweizer Treuhänder-Assistent der ein Bewertungs-Interview führt.

Stelle EINE Frage auf einmal zu: stille Reserven, Unternehmerlohn, ausserordentliche Positionen.
Nach 3 Fragen (oder wenn alle Infos vorhanden) antworte mit JSON:
{"complete":true,"stilleReservenVorjahr":ZAHL,"stilleReservenAktuell":ZAHL,"lohnAktuell":ZAHL,"lohnMarktgerecht":ZAHL,"aoAufwand":ZAHL,"aoErtrag":ZAHL}

Extrahierte Basisdaten: ${JSON.stringify(extracted)}`,
          messages:newHistory.map(m=>({role:m.role,content:m.content}))
        })
      });
      const data = await res.json();
      const txt = data.content.find(b=>b.type==="text")?.text||"";

      // Prüfe ob complete
      try {
        const clean = txt.replace(/```json|```/g,"").trim();
        const idx = clean.indexOf('{"complete"');
        if(idx>=0) {
          const jsonStr = clean.slice(idx);
          const result = JSON.parse(jsonStr);
          if(result.complete) {
            setInterviewData(result);
            setChatHistory([...newHistory,{role:"assistant",content:"✓ Danke – alle Informationen erfasst. Die Felder werden jetzt ausgefüllt."}]);
            setPhase("done");
            setChatLoading(false);
            return;
          }
        }
      } catch(e){}

      setChatHistory([...newHistory,{role:"assistant",content:txt}]);
    } catch(e) {
      setChatHistory([...newHistory,{role:"assistant",content:"Entschuldigung, es gab einen Fehler. Bitte versuche es nochmal."}]);
    }
    setChatLoading(false);
  };

  const handleImport = () => {
    if(!extracted) return;
    const j = extracted.jahre||[];
    const j1 = j[0]||{}, j2 = j[1]||{}, j3 = j[2]||{};
    const iData = interviewData;

    onImport({
      stammdaten: {
        rechtsform: extracted.rechtsform||"",
        kanton: extracted.kanton||"",
      },
      sv: {
        ek: String(extracted.jahre?.[0]?.eigenkapitalOhneGewinn||""),
        jg: String(j1.jahresgewinn||""),
        deb: String(extracted.bilanz?.debitoren||""),
        vor: String(extracted.bilanz?.vorraete||""),
        ang:"", traA:"", traP:"",
        rueck: String(extracted.bilanz?.rueckstellungen||""),
        avBw: String(extracted.bilanz?.anlagevermoegenBuchwert||""),
        avVk:"", nbBw:"", nbVk:"",
        div:"",
      },
      ewPatch: {
        j1: {gewinn:String(j1.jahresgewinn||""),steuern:String(j1.steuern||""),srVj:String(iData.stilleReservenVorjahr||""),srAkt:String(iData.stilleReservenAktuell||""),lohnAkt:String(iData.lohnAktuell||""),lohnMkt:String(iData.lohnMarktgerecht||""),aoAuf:String(iData.aoAufwand||""),aoErt:String(iData.aoErtrag||"")},
        j2: j2.jahresgewinn?{gewinn:String(j2.jahresgewinn||""),steuern:String(j2.steuern||""),srVj:String(iData.stilleReservenVorjahr||""),srAkt:String(iData.stilleReservenAktuell||""),lohnAkt:String(iData.lohnAktuell||""),lohnMkt:String(iData.lohnMarktgerecht||""),aoAuf:String(iData.aoAufwand||""),aoErt:String(iData.aoErtrag||"")}:null,
        j3: j3.jahresgewinn?{gewinn:String(j3.jahresgewinn||""),steuern:String(j3.steuern||""),srVj:String(iData.stilleReservenVorjahr||""),srAkt:String(iData.stilleReservenAktuell||""),lohnAkt:String(iData.lohnAktuell||""),lohnMkt:String(iData.lohnMarktgerecht||""),aoAuf:String(iData.aoAufwand||""),aoErt:String(iData.aoErtrag||"")}:null,
        branche: extracted.branche||"",
        z2: !!j2.jahresgewinn,
        z3: !!j3.jahresgewinn,
      },
      muPatch: {
        gew: String(j1.jahresgewinn||""),
        st:  String(j1.steuern||""),
        zi:  String(j1.zinsaufwand||""),
        lA:  String(iData.lohnAktuell||""),
        lM:  String(iData.lohnMarktgerecht||""),
        aoA: String(iData.aoAufwand||""),
        aoE: String(iData.aoErtrag||""),
        srVj:String(iData.stilleReservenVorjahr||""),
        srA: String(iData.stilleReservenAktuell||""),
        branche: extracted.branche||"",
        maKl: extracted.mitarbeitende||"",
      }
    });
    onClose();
  };

  return (
    <div style={{position:"fixed",inset:0,background:"rgba(0,0,0,0.82)",zIndex:1000,display:"flex",alignItems:"center",justifyContent:"center",padding:"1rem"}}
      onClick={phase==="upload"?onClose:undefined}>
      <div style={{background:C.card,border:`1px solid ${C.border}`,borderRadius:12,width:"100%",maxWidth:520,maxHeight:"90vh",display:"flex",flexDirection:"column",boxShadow:"0 0 80px rgba(30,111,99,0.10)"}}
        onClick={e=>e.stopPropagation()}>

        {/* Header */}
        <div style={{padding:"1.3rem 1.5rem",borderBottom:`1px solid ${C.border}`,display:"flex",justifyContent:"space-between",alignItems:"center"}}>
          <div>
            <div style={{fontSize:10.5,letterSpacing:"0.18em",color:C.accent,textTransform:"uppercase",fontFamily:T.mono,marginBottom:3}}>AI-Assistent</div>
            <div style={{fontSize:15,color:C.text,fontFamily:T.sans,fontWeight:600}}>Aus Jahresrechnung importieren</div>
          </div>
          <button onClick={onClose} style={{background:"none",border:"none",color:C.dim,cursor:"pointer",fontSize:18,fontFamily:T.mono}}>×</button>
        </div>

        {/* Upload Phase */}
        {phase==="upload"&&(
          <div style={{padding:"1.5rem",display:"flex",flexDirection:"column",gap:"1rem"}}>
            <p style={{fontSize:11,color:C.muted,fontFamily:T.mono,lineHeight:1.8}}>
              Lade 1–3 Jahresrechnungen als PDF hoch. Die AI liest die Buchwerte automatisch aus und stellt danach gezielte Fragen zu stillen Reserven, Unternehmerlohn und ausserordentlichen Positionen.
            </p>
            <label style={{display:"flex",flexDirection:"column",alignItems:"center",justifyContent:"center",gap:"0.5rem",padding:"2rem",background:C.bg,border:`2px dashed ${files.length?C.accent:C.border}`,borderRadius:8,cursor:"pointer",transition:"border-color 0.2s"}}>
              <span style={{fontSize:28}}>📄</span>

              </span>
              <span style={{fontSize:11,color:"#b0b3bc",fontFamily:T.mono}}>Bilanz + Erfolgsrechnung · max. 3 Dateien</span>
              <input type="file" accept=".pdf" multiple onChange={handleFiles} style={{display:"none"}} />
            </label>
            <button onClick={handleParse} disabled={!files.length}
              style={{padding:"0.75rem",background:files.length?C.green:"#ffffff",border:`1px solid ${files.length?C.greenb:C.border}`,borderRadius:7,color:files.length?C.accent:C.dim,fontSize:11,fontFamily:T.mono,fontWeight:600,cursor:files.length?"pointer":"not-allowed",letterSpacing:"0.1em"}}>
              {files.length?"JAHRESRECHNUNG EINLESEN →":"ZUERST PDF HOCHLADEN"}

        {/* Parsing Phase */}
        {phase==="parsing"&&(
